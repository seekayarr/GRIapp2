lisation is “to achieve a state of calmness without sedation, sleep or unconsciousness, thereby reducing the risk to self and/or others while maintaining the ability of the patient to respond to communication”(NICE, 2005) when appropriate psychological and behavioural approaches have failed to de-escalate acutely disturbed behaviour.", "overviewBlocks": [{"heading": "", "ordered": false, "items": ["Rapid tranquilisation is an option of last resort", "The role of rapid tranquillisation in minimising risk to the patient or others.", "The rapid tranquillisation box is kept in the sedation cupboard (7) in resus.", "Patients who require rapid tranquillisation may need higher levels of observation."]}], "critical": ["Prolonged QT", "Be prepared for apnoea"], "signs": ["Agitation", "Aggression"], "drugs": ["Olanzapine", "Oral/IM", "Lorazepam", "Oral/IM/IV", "Promethazine", "Oral/IM", "Ketamine", "IM/IV"], "equipment": ["Observations", "ECG", "ACVPU", "If patient refuses observations document what you can", "Colour, airway, breathing, GCS."], "steps": [], "indications": [], "contraindications": [], "documentation": [], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARD054", "catId": "CAT12", "title": "Combat Tourniquet", "overview": "Life-threatening extremity exsanguination will need pressure and lots of it. The combat tourniquet is a military-designed tourniquet that can be applied easily and with adequate force to control arterial haemorrhage. The tourniquet can be safely applied for up to 2 hours.", "overviewBlocks": [], "critical": ["Limb ischaemia if time extends past 2 hours", "Signs of Shock"], "signs": [], "drugs": [], "equipment": ["Combat tourniquet (kept in trauma trolley)"], "steps": [{"heading": "Steps", "ordered": true, "items": ["Place around arm with rod on outside", "Should be 3 fingerbreadths above wound", "Feed strap through inner feed of buckle", "Pull to length", "Feed strap through outer feed of buckle", "Pull to length", "Pull strap to tighten tourniquet around arm", "Should be tight enough to prevent operator placing a finger under the strap", "Wrap the excess strap around arm and fasten with velcro to tourniquet", "Excess strap can be folded on itself", "Twist the rod to further tighten the tourniquet", "Continue until bleeding from the wound stops or radial pulse is no longer palpable", "When appropriate pressure applied, place one end of rod into clip to lock into place", "Fold strap over clip to further lock into position", "Write time that tourniquet was sited onto the strap"]}], "indications": [], "contraindications": [], "documentation": [], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARD055", "catId": "CAT12", "title": "Pelvic Binder", "overview": "The Sam Splint is a device that helps to stabilise the unstable pelvis. It has a patented autostop buckle which prevents further pulling when the correct compression force is applied.", "overviewBlocks": [{"heading": "Key tips:", "ordered": false, "items": ["Lay splint on bed before the arrival of a trauma patient likely to have a pelvic injury", "Correct site is at the level of the GREATER TROCHANTERS (so often a little lower than you would first think)", "ensure nothing in patient pockets before applying", "When correct force applied an audible click is heard and two prongs are released preventing further force being delivered", "ensure these prongs remain visible when strap secured in place"]}], "critical": ["Because the pelvic bones are near major blood vessels and organs, pelvic fractures may cause extensive bleeding and other injuries that require urgent treatment.", "Be prepared for signs of internal bleeding", "Adequate analgesia"], "signs": [], "drugs": [], "equipment": ["SAM Splint (kept in trauma trolley)"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARD056", "catId": "CAT12", "title": "Nasal High Flow", "overview": "Nasal high flow (NHF) is high flow humidified air or oxygen delivered via a nasal cannula. Can provide up to 60 L of high flow and 21%-95% O2 delivery.", "overviewBlocks": [{"heading": "NHF works by", "ordered": false, "items": ["Clearing the upper airway of dead space and allowing clearance of CO2", "Gives dynamic positive airway pressure", "Humidified inhaled air to stop drying of the epithelium and reduce the chance of thickening secretions."]}, {"heading": "", "ordered": false, "items": ["OXY-GIN analogy, O2 is Gin and Flow = tonic, more tonic will dilute the gin.", "O2 + Flow = % of concentration", "More flow will dilute the % of O2 delivered.", "Air filter requires changed at 1000 hours."]}], "critical": ["Tubing is heated to 40°C", "Do not let patient lie on tubing (CAN CAUSE BURNS)", "Grey band goes to top of crown", "Should not touch the ears at all", "85% of the UK population will fit the M nasal cannula band.", "DO NOT USE NaCl 0.9% FOR INHALATION", "Only water for inhalation to be used.", "DO NOT BIN DISINFECTION RED TUBING OR BUNG"], "signs": [], "drugs": [], "equipment": ["Airvo2", "Appropriate sized Nasal Cannula", "Elbow", "Chamber", "Water for inhalation", "Cardiac monitoring", "Continuous spO2 monitoring", "NIBP (frequent BPs)", "Tubing for NC", "O2 tubing for flow metre"], "steps": [{"heading": "Steps:", "ordered": true, "items": ["Gather equipment", "Fit elbow on top of filter chamber", "Press down silver guard and push filter in until it clicks", "Once secured spike water for inhalation bag and allow to flow", "There is no clamp for the tubing so do not spike prior to securing the filter.", "Turn on and wait for tick to allow for humidity and heat", "Change options using play button going from L to R", "Can only change heat and humidity", "Hold up and down arrow together to change and unlock", "Heat to preference and tolerability", "Minimum flow will be 30-35L. Aim rate around 50 L/min.", "O2 will be added in via flow metre", "Connect NC to flow tubing", "Choose appropriate NC size for patient and grey band goes to crown of head, occluding nostril size by a maximum of 50% to allow for adequate pressure.", "After patient use will require disinfection using RED tubing and bung, this process will take 1 hour. Do NOT BIN RED TUBING OR BUNG."]}], "indications": ["Pt who is conscious, spontaneously breathing and requires respiratory support.", "All type 1 respiratory failure", "Type 2 respiratory failure if not tolerating NIV or requiring breaks"], "contraindications": ["Undrained pneumothorax", "Basal skull fractures"], "documentation": [], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARDMI01", "catId": "CAT13", "title": "Eye Irrigation", "overview": "Eye irrigation is used to flush particles and harmful chemicals from the conjunctiva and cornea.", "overviewBlocks": [{"heading": "", "ordered": false, "items": ["Immediate initiation of irrigation is the prime objective when treating chemical ocular burns. Defer other parts of evaluation and treatment, even normally preliminary tasks, including external examination of the eye and rudimentary assessment of visual acuity, until after irrigation.", "Whenever possible, check the pH of the eye before irrigation, by touching the lower fornix with a piece of pH paper, check pH as soon as possible after beginning irrigation. Normal pH of the eye as measured with pH paper is about 7.0.", "Ask the patient to look upward, and then place a drop of topical ocular anaesthetic into the lower fornix of the affected eye. Tell the patient to keep the eye closed until the irrigation begins, in order to retain the drug.", "In one hand, hold the end of the IV tubing about 3 to 5 cm from the eye. Fully open the tubing to achieve optimal irrigation flow.", "Direct the irrigation stream over the entire surface of the eye, including both the inferior and superior fornices and the cornea. The stream should flow over the surface and should never be pointed directly at the cornea.", "When treating a chemical burn, also rapidly flush the skin surfaces of the eyelids and periorbital area to remove lingering chemicals.", "For prolonged irrigation (eg, > 15 min), consider using a morgans lens.", "Check the pH of the eye(s) when irrigation is finished. If the pH is not normal, continue irrigation. If the pH is normal, re-check it after another 20 min to see whether irrigation should be started again because chemicals can continue to leach out of the tissue and alter what appeared to be a normalised pH."]}], "critical": ["Absolute contraindications: None", "Relative contraindications: If eye perforation is suspected, irrigation should be deferred until formal eye examination can be done. If the cornea may have a deep injury or foreign body, irrigation using a scleral lens may cause further injury and should not be done. Irrigate the eye manually, gently, and very carefully. The cornea or conjunctiva may be mechanically abraded by the tip of the IV tubing, by the scleral lens, or by an irrigating stream pointed directly at the cornea."], "signs": [], "drugs": [], "equipment": ["Irrigating solution, eg, normal (0.9%) saline, Ringer's lactate, warmed when possible; several liters may be needed for prolonged irrigation", "IV tubing and IV pole", "Drainage basin and towels to collect irrigation fluid runoff", "Face/eye protection, gloves, and gown for operator(s)", "Local anesthetic", "Expanded pH paper or pH test strips", "Gauze pads, eyelid retractors", "Cotton-tipped applicators (swabs)", "Scleral (irrigating) lens (Morgans Lens)"], "steps": [], "indications": ["Chemical injury to the eye (caustic chemical burns are a medical emergency; irrigation should begin as soon as possible", "Removal of small particulate matter from the eye", "Treatment of foreign body sensation when no particulates are visible (sometimes successful)"], "contraindications": [], "documentation": [], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARDMI02", "catId": "CAT13", "title": "Buddy Strap- FINGERS", "overview": "In buddy-taping, a digit that requires immobilisation (eg, because of an injury or deformity) is attached to an adjacent, unaffected digit, helping to provide alignment as well as support and protection. The unaffected digit provides support during range of motion of the injured digit.", "overviewBlocks": [], "critical": ["Absolute contraindications", "Unstable or displaced phalangeal fracture", "Dislocations that remain unstable after reduction", "Tendon injuries (eg, mallet finger, boutonnière injury)", "Open fracture", "Relative contraindications", "None"], "signs": [], "drugs": [], "equipment": ["Cotton Padding", "Tape", "Extra for patient to take home"], "steps": [{"heading": "Steps", "ordered": false, "items": ["Insert cotton padding or gauze between the fingers being splinted to prevent skin maceration between the fingers. Ensure there are no folds in the gauze between the fingers.", "Apply tape around both fingers to bind the injured finger against the uninjured finger.", "Use one strip of tape to bind adjacent phalanges proximally between the metacarpophalangeal and proximal interphalangeal (PIP) joints, leaving the interphalangeal joints untaped to allow them to flex and extend.", "Use a second piece of tape to bind the 2 digits distally between the PIP and distal interphalangeal (DIP) joints, again leaving the interphalangeal joints untaped to allow motion of those joints.", "Check distal sensation and capillary refill."]}], "indications": ["Minor finger sprain* Includes sprains with small avulsion fracture.", "Nondisplaced stable fracture of the proximal or middle phalanx", "Proximal interphalangeal (PIP) dislocations (reduced)"], "contraindications": [], "documentation": ["Complications", "Skin breakdown due to lack of padding between fingers", "Vascular compromise, usually due to an overly tight application"], "ask": [], "discharge": ["How Long to keep on for", "What to look out for", "Moving and use"], "resources": [], "needsContent": false}, {"id": "CARDMI03", "catId": "CAT13", "title": "Buddy Strapping- TOES", "overview": "In buddy-taping, a digit that requires immobilisation (eg, because of an injury or deformity) is attached to an adjacent, unaffected digit, helping to provide alignment as well as support and protection. The unaffected digit provides support during range of motion of the injured digit.", "overviewBlocks": [], "critical": ["Contraindications", "Absolute contraindications", "Open fracture", "Relative contraindications", "Certain fractures of the big toe (some require fixation)"], "signs": [], "drugs": [], "equipment": ["Cotton Padding", "Tape"], "steps": [{"heading": "Steps", "ordered": false, "items": ["Give the patient adequate analgesia.", "Insert cotton padding or gauze between the toes being splinted to prevent skin maceration between the toes.", "Apply tape around both toes to bind the injured toe against the uninjured toe.", "Check distal sensation and capillary refill.", "Do not tape toes too tightly or apply tape over joints."]}], "indications": ["Toe sprain, dislocation, or fracture", "Structural toe disorders (eg, hallux limitus)"], "contraindications": [], "documentation": ["Complications", "Skin breakdown due to lack of padding and maceration between toes", "Vascular compromise, usually due to an overly tight application"], "ask": [], "discharge": ["How Long to keep on for", "What to look out for", "Moving and use"], "resources": [], "needsContent": false}, {"id": "CARDMI04", "catId": "CAT13", "title": "Wound Glue", "overview": "Wound glue or adhesives, or biodegradable bonding agents, can be used to close small, straight, superficial, low-tension wounds.", "overviewBlocks": [], "critical": ["Absolute contraindications", "bites (dog / cat/human) - bites should be closed using a partial closure technique only.", "Relative contraindications", "Sites overlying or near joints or very near the eyes, moist or mucosal surfaces, or wounds under significant static or dynamic skin tension", "Wounds >24 hours old", "Infected wounds", "Wounds involving deep structures (eg, nerves, blood vessels, ducts, joints, tendons, bones) should be referred to a surgical specialist, as should those covering large areas or involving the face or hands.", "If near the eye in any capacity gauze can be placed over the eye to protect it from running into the eye."], "signs": [], "drugs": [], "equipment": ["Wound Glue (in fridge)", "Dressing Pack, with cleansing equipment"], "steps": [{"heading": "Steps", "ordered": false, "items": ["Cleanse and dry the wound.", "Achieve haemostasis (stop bleeding)", "Hold the wound edges together with forceps, gauze pads, or fingers.", "Squeeze the plastic container to apply droplets of tissue adhesive along the length of the wound's surface, and extend it about 1 to 2 cm from each side of the wound.", "Support and hold the edges of the wound together for at least 1 minute while the adhesive dries.", "Apply 3 to 4 layers of adhesive, allowing each one to dry before applying another layer."]}], "indications": [], "contraindications": [], "documentation": ["Common Errors", "It is especially important to control bleeding from the wound. With poor hemostasis, the patient may experience overheating of polymerisation resulting in a burning sensation or an actual burn.", "Overheating of polymerisation may also occur when excessive amounts of adhesive are applied too quickly.", "If washed or soaked, the adhesive may peel off before the wound is healed.", "Some substances, such as a latex-gloved finger, gauze, or plastic instruments, may adhere to the patient's skin during adhesive application. There is no adhesion with vinyl gloves or tissue instruments.", "Rapid or uncontrolled application may cause the adhesive to run, occasionally inadvertently gluing adjacent structures or material. Applying antibiotic ointment or petroleum jelly will dissolve the misplaced adhesive."], "ask": [], "discharge": ["Tissue adhesive serves as its own wound dressing and has an antimicrobial effect against gram-positive organisms. The material sloughs off on its own in 5 to 10 days; there is no need for follow-up.", "Discharge advice - don't pick the wound. Wound glue to be kept dry for 48 hours.", "Observe for signs of infection."], "resources": [], "needsContent": false}, {"id": "CARDMI05", "catId": "CAT13", "title": "Steristrips", "overview": "Steri-Strips are adhesive skin-closure strips used to close small, superficial wounds or to support sutured wounds. They are ideal for low-tension lacerations and post-suture reinforcement.", "overviewBlocks": [], "critical": ["Wound Assessment:", "Only use Steri-Strips on clean, shallow, linear wounds.", "No active bleeding – haemostasis must be achieved first.", "Not suitable for high-tension, jagged, infected, or deep wounds.", "Contraindications:", "Avoid in areas with moisture, high mobility, or hair unless adequately prepared.", "Pre-tibial laceration / elderly skin tears.", "Common Error", "Too many used- allow for suitable gaps between steristrips to spread tension."], "signs": [], "drugs": [], "equipment": ["Wound Glue (in fridge)", "Dressing Pack, with cleansing equipment"], "steps": [{"heading": "Steps", "ordered": false, "items": ["Clean and dry the wound thoroughly.", "Ensure haemostasis is achieved.", "Cut Steri-Strips to appropriate length.", "Approximate wound edges with fingers or forceps", "Apply strips perpendicular to the wound, starting at the centre and moving outward.", "Smooth down to ensure adhesion.", "If needed, add reinforcing longitudinal strips or cover with dressing."]}, {"heading": "", "ordered": false, "items": ["Apply strips with even spacing and tension, ensuring skin edges are well aligned."]}], "indications": [], "contraindications": [], "documentation": ["Common Errors", "It is especially important to control bleeding from the wound. With poor hemostasis, the patient may experience overheating of glue resulting in a burning sensation or an actual burn.", "Overheating of glue may also occur when excessive amounts of adhesive are applied too quickly.", "If washed or soaked, the adhesive may peel off before the wound is healed.", "Some substances, such as a latex-gloved finger, gauze, or plastic instruments, may adhere to the patient's skin during adhesive application.", "Rapid or uncontrolled application may cause the adhesive to run, occasionally inadvertently gluing adjacent structures or material. Applying antibiotic ointment or petroleum jelly will dissolve the misplaced adhesive."], "ask": [], "discharge": ["Keep dry for the first 24–48 hours.", "Avoid soaking (e.g. baths or swimming); showers are fine if covered.", "Do not pick at or pull strips off – they will usually fall off naturally after 5–7 days.", "Watch for signs of infection: redness, swelling, pain, discharge, or fever.", "Return for review if: The wound reopens", "Increased pain or signs of infection", "The strips fall off too early (within 24–48 hours)"], "resources": [], "needsContent": false}, {"id": "CARDMI06", "catId": "CAT13", "title": "Fractures", "overview": "Some fractures require conservative management only - please follow conservative management advice (with advice re: return to sports / how long to be off sports - particularly important for children).", "overviewBlocks": [{"heading": "", "ordered": false, "items": ["Distraction, displacement, angulation, or shortening (overriding) may occur.", "Distraction is separation in the longitudinal axis.", "Displacement is the degree to which the fractured ends are out of alignment with each other; it is described in millimeters or bone width percentage.", "Angulation is the angle of the distal fragment measured from the proximal fragment.", "Displacement and angulation may occur in the ventral-dorsal plane, lateral-medial plane, or both."]}, {"heading": "", "ordered": false, "items": ["PRICE (protection, rest, ice, compression, elevation) may be beneficial.", "Protection helps prevent further injury. It may involve limiting the use of an injured part, applying a splint or cast, or using crutches.", "Rest may prevent further injury and speed healing.", "Ice and compression may minimise swelling and pain. Ice is enclosed in a plastic bag or towel and applied intermittently during the first 24 to 48 hours (for 15 to 20 minutes, as often as possible).", "Injuries can be compressed by a splint, an elastic bandage, or, for certain injuries likely to cause severe swelling.", "Elevating the injured limb above the heart for the first 2 days in a position that provides an uninterrupted downward path; such a position allows gravity to help drain oedema fluid and minimise swelling."]}, {"heading": "", "ordered": false, "items": ["After 48 hours, periodic application of warmth (eg, a heating pad) for 15 to 20 minutes may relieve pain and speed healing."]}], "critical": ["Prolonged immobilisation (> 3 to 4 weeks for young adults) of a joint can cause stiffness, contractures, and muscle atrophy", "These complications may develop rapidly and may be permanent, particularly in older people.", "Some rapidly healing injuries are best treated with resumption of active motion within the first few days or weeks; such early mobilisation may minimise contractures and muscle atrophy, thus accelerating functional recovery.", "Splints and casts should immobilise joints in positions that optimise the likelihood of return of full function"], "signs": [], "drugs": [], "equipment": ["Splints", "POP Blackslab"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "ask": [], "discharge": ["How Long to keep on for", "What to look out for", "Moving and use"], "resources": [], "needsContent": false}, {"id": "CARDMI07", "catId": "CAT13", "title": "Back Slab", "overview": "Backslabs in our ED are mainly for unstable fractures being admitted. Most stable # are treated as an outpatient with a walking boot or splint. The old technique of applying a layer of wet cling bandage is no longer required and can lead to shrinkage (and risk of compartment syndrome) when it dries and shrinks up to 7% in circumference. May be appropriate to 'cast for comfort' in patients who are too sore in a splint.", "overviewBlocks": [{"heading": "Preparation", "ordered": false, "items": ["Assess & consent: Confirm indication, check skin, remove jewellery. Give analgesia.", "Neurovascular (NV) check: Document colour, warmth, capillary refill, pulses, sensation, movement before and after.", "Plan slab: What is required? Below-elbow, above-elbow long arm, below-knee)."]}], "critical": ["Flat palms of hands to mould the plaster (finger pressure increases risk of focal skin necrosis)", "Avoid pressure points", "Ensure movement of joints above backslab", "Normal advise is measure around 2 fingers below joint while joint is at 90 degree angle to avoid pressure damage to this skin", "Be aware of water temperature and risk of burning patients", "POP is extremely alkaline and can cause skin breakdown if left on skin, ensure proper coverage of underlayer and cleansing of skin post application.", "Remove any rings/jewellery"], "signs": [], "drugs": [], "equipment": ["Soffban", "Tape", "Dry Cling", "Scissors", "Support Bandage (crepe)", "POP (cut and sized to limb requirement)"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "ask": ["Which limb and side? (e.g. left vs right — always confirm!)", "Which type of slab? (e.g. below-elbow, above-elbow long arm, below-knee, long leg, U-slab/stirrup)", "What is the exact position required? (e.g. wrist 20° extension, ankle at 90°, knee slightly flexed)", "Is this definitive management or a temporary splint until swelling settles?", "Is the patient for fracture clinic or orthopaedic review before discharge?"], "discharge": ["How Long to keep on for", "What to look out for", "Signs of compartment syndrome, numbness,", "Moving and use"], "resources": [], "needsContent": false}, {"id": "CARDMI08", "catId": "CAT13", "title": "Below Knee Backslab", "overview": "", "overviewBlocks": [{"heading": "Step-by-step application (generic)", "ordered": false, "items": ["Measure & cut the slab:", "Width roughly matches the limb's posterior width (usually 7.5–10 cm for forearm, 10–15 cm for leg).", "Length spans the intended landmarks.", "Layer count (adult): 10.", "Prepare water: Lukewarm (not hot) to avoid excessive exotherm.", "Limb protection: Wrap double layer of soffban at starting point, continue wrapping length of affected limb covering 50% of the wrap above.. Add extra over bony points (olecranon, ulnar styloid, malleoli, heel, wrist).", "Wet the plaster: Dunk the pre-cut slab; lift and gently squeeze (don't wring).", "Position the limb (as required) and apply the slab to the posterior aspect, centred, with 1–2 cm of padding beyond the plaster edges.", "Mould with the palms (never fingertips) to the desired contours.", "Cling at starting point, continue wrapping length of affected limb covering 50% of the wrap above no tension.", "Secure with crepe bandage: Spiral wrap with even, no tension. Edges: fold back stockinette/padding to create soft borders and tape down. Leave fingers/toes fully visible.", "Maintain position until initial set (normally 5–7 min).", "Final NV checks: Compare to pre-application. Re-check again after 10–15 min once warmth settles."]}, {"heading": "", "ordered": false, "items": ["Always give crutches and patient non weightbearing."]}], "critical": ["Flat palms of hands to mould the plaster (finger pressure increases risk of focal skin necrosis)", "Caution used for patients with falls risk."], "signs": [], "drugs": [], "equipment": ["Soffban", "Tape", "Dry Cling", "Scissors", "Support Bandage (crepe)", "POP (cut and sized to limb requirement)"], "steps": [], "indications": [], "contraindications" <script>
const { categories: CATEGORIES, cards: CARDS } = window.APP_DATA;
const QUESTIONS_API = "/api/questions";

// Content review reminder: shows a banner (does not block access) once the expiry date passes.
const CONTENT_REVIEW_DATE = new Date("2026-08-12T00:00:00");
const CONTENT_EXPIRY_DATE = new Date("2027-08-12T00:00:00");
(function checkExpiry(){
  if(new Date() >= CONTENT_EXPIRY_DATE){
    const banner = document.getElementById("expiryBanner");
    const dateSpan = document.getElementById("expiryFromDate");
    if(dateSpan){
      dateSpan.textContent = CONTENT_REVIEW_DATE.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
    }
    if(banner){ banner.style.display = "block"; }
  }
})();

const state = { view:"home", catId:null, searchTerm:"", cardId:null, qaCardId:null, questions:[], pending:[], pin:"", loaded:false, storageOk:true, pinOk:false, educatorLoaded:false, educatorOk:true, askFormOpenFor:null };

function showToast(msg){
  const host = document.getElementById("toastHost");
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  host.appendChild(t);
  setTimeout(()=>t.remove(), 2400);
}

function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), ms))
  ]);
}

async function loadQuestions(){
  try{
    const res = await withTimeout(fetch(QUESTIONS_API), 5000);
    if(!res.ok) throw new Error("bad response");
    const data = await res.json();
    state.questions = data.questions || [];
    state.storageOk = true;
  }catch(e){
    state.questions = [];
    state.storageOk = false;
  }
  state.loaded = true;
  render();
}
async function loadPendingForEducator(pin){
  const res = await withTimeout(fetch(`${QUESTIONS_API}?pin=${encodeURIComponent(pin)}`), 5000);
  if(res.status===403){ return { ok:false, reason:"pin" }; }
  if(!res.ok){ return { ok:false, reason:"network" }; }
  const data = await res.json();
  state.pending = (data.questions || []).filter(q=>q.status==="Pending");
  return { ok:true };
}
function catById(id){ return CATEGORIES.find(c=>c.id===id); }
function escapeHtml(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function escapeAttr(s){ return (s||"").replace(/"/g,"&quot;"); }

function renderSearch(){
  const area = document.getElementById("searchArea");
  if(state.view==="home" || state.view==="list"){
    area.innerHTML = `<div class="search-wrap"><span>🔍</span>
      <input id="searchInput" type="text" placeholder="Search action cards…" value="${escapeAttr(state.searchTerm)}" oninput="onSearch(this.value)"></div>`;
  } else { area.innerHTML = ""; }
}

function splitOverview(text){
  // Splits on a period followed by whitespace and a capital letter, only when
  // the period follows a lowercase letter, digit, or closing bracket — this
  // targets real sentence breaks and avoids splitting things like "e.g." or
  // decimals. Purely a display split: no words, punctuation or content is altered.
  const parts = text.split(/(?<=[a-z0-9\)]\.)(?<!e\.g\.)(?<!i\.e\.)\s+(?=[A-Z])/);
  return parts.map(p=>p.trim()).filter(Boolean);
}

function renderOverview(text){
  const parts = splitOverview(text);
  if(parts.length<=1) return `<div class="overview"><p>${escapeHtml(text)}</p></div>`;
  return `<div class="overview"><ul>${parts.map(p=>`<li>${escapeHtml(p)}</li>`).join("")}</ul></div>`;
}

function bulletBox(label, cls, items){
  if(!items || items.length===0) return "";
  return `<div class="box ${cls}"><div class="box-label"><span class="dot"></span>${label}</div>
    <ul>${items.map(i=>`<li>${escapeHtml(i)}</li>`).join("")}</ul></div>`;
}

function blocksBox(label, cls, blocks){
  if(!blocks || blocks.length===0) return "";
  let inner = "";
  blocks.forEach(b=>{
    if(b.heading){ inner += `<div class="sub-heading">${escapeHtml(b.heading)}</div>`; }
    const tag = b.ordered ? "ol" : "ul";
    inner += `<${tag}>${b.items.map(i=>`<li>${escapeHtml(i)}</li>`).join("")}</${tag}>`;
  });
  return `<div class="box ${cls}"><div class="box-label"><span class="dot"></span>${label}</div>${inner}</div>`;
}

function resourcesBox(resources){
  const items = resources || [];
  let inner;
  if(items.length===0){
    inner = `<div class="resources-empty">No linked resources yet for this card.</div>`;
  } else {
    inner = `<ul>${items.map(r=>`<li><a href="${escapeHtml(r.url||'#')}" target="_blank" rel="noopener">${escapeHtml(r.label||r.url||'Link')}</a></li>`).join("")}</ul>`;
  }
  return `<div class="box resources"><div class="box-label"><span class="dot"></span>Resources</div>${inner}</div>`;
}

function render(){
  renderSearch();
  const c = document.getElementById("content");
  const title = document.getElementById("pageTitle");

  if(state.view==="home"){
    title.textContent = "Action Cards";
    let html = `<div class="section-label">Browse by section</div><div class="cat-grid">`;
    CATEGORIES.forEach(cat=>{
      html += `<div class="cat-tile" style="--bar:${cat.color}" onclick="openCategory('${cat.id}')">
        <div class="cname">${cat.name}</div><div class="ccount">${cat.count} cards</div></div>`;
    });
    html += `</div>
      <div class="section-label">Questions</div>
      <div class="card-row" onclick="openAllQA()">
        <div><div class="ctitle">Questions &amp; Answers</div><div class="csub">Answered questions from every card</div></div>
        <span class="chev">›</span>
      </div>
      <div class="footer-link" onclick="goAnswerGate()">Lead / educator: check &amp; answer questions</div>`;
    c.innerHTML = html;
  }

  if(state.view==="allQuestions"){
    title.textContent = "Questions & Answers";
    if(!state.loaded){ c.innerHTML = `<div class="back-row" onclick="goHome()">‹ Cards</div><div class="loading">Connecting…</div>`; return; }
    if(!state.storageOk){
      c.innerHTML = `<div class="back-row" onclick="goHome()">‹ Cards</div>
        <div class="empty">Question data isn't connecting right now.
        <div style="margin-top:10px;"><span style="text-decoration:underline;cursor:pointer;" onclick="loadQuestions()">Try again</span></div></div>`;
      return;
    }
    const answered = state.questions.slice().reverse();
    let html = `<div class="back-row" onclick="goHome()">‹ Cards</div>
      <div class="section-label">${answered.length} answered question${answered.length===1?'':'s'}</div>`;
    if(answered.length===0){ html += `<div class="empty">No answered questions yet.</div>`; }
    answered.forEach(q=>{
      html += `<div class="qa-item">
        <div class="qa-card-label" onclick="openCard('${q.cardId}')">${escapeHtml(q.cardTitle)}</div>
        <div class="qtext">${escapeHtml(q.question)}</div>
        <div class="qmeta">Asked ${q.dateSubmitted}</div>
        <div class="qanswer"><div class="qalabel">Answer</div>${escapeHtml(q.answer)}
          <div class="qmeta" style="margin-top:4px;">Answered ${q.dateAnswered}</div></div>
      </div>`;
    });
    c.innerHTML = html;
  }

  if(state.view==="list"){
    const filtered = CARDS.filter(card=>{
      const matchesCat = state.catId ? card.catId===state.catId : true;
      const term = state.searchTerm.trim().toLowerCase();
      const matchesSearch = term ? (card.title.toLowerCase().includes(term) || (card.overview||"").toLowerCase().includes(term)) : true;
      return matchesCat && matchesSearch;
    });
    const label = state.searchTerm ? `Results for "${state.searchTerm}"` : (catById(state.catId)?.name || "All cards");
    title.textContent = label;
    let html = `<div class="back-row" onclick="goHome()">‹ All sections</div>`;
    if(filtered.length===0){ html += `<div class="empty">No cards match. Try a different search term.</div>`; }
    filtered.forEach(card=>{
      html += `<div class="card-row" onclick="openCard('${card.id}')">
        <div><div class="ctitle">${escapeHtml(card.title)}</div><div class="csub">${catById(card.catId).name}</div></div>
        <div style="display:flex;align-items:center;gap:8px;">${card.needsContent ? '<span class="badge flag">Needs content</span>' : ''}<span class="chev">›</span></div>
      </div>`;
    });
    c.innerHTML = html;
  }

  if(state.view==="detail"){
    const card = CARDS.find(x=>x.id===state.cardId);
    title.textContent = "Action Card";
    let html = `<div class="back-row" onclick="goBackToList()">‹ Back</div>
      <div class="detail-cat">${catById(card.catId).name}</div>
      <div class="detail-title">${escapeHtml(card.title)}</div>`;
    if(card.needsContent){
      html += `<div class="needs-content">This card was blank in the source document — needs local content before it's safe to rely on.</div>`;
    }
    if(card.overview){ html += renderOverview(card.overview); }
    html += blocksBox("Overview", "steps", card.overviewBlocks);
    html += bulletBox("Ask", "ask", card.ask);
    html += bulletBox("Critical Considerations", "critical", card.critical);
    html += bulletBox("Signs &amp; Symptoms", "signs", card.signs);
    html += bulletBox("Drugs", "drugs", card.drugs);
    html += bulletBox("Equipment", "equipment", card.equipment);
    html += bulletBox("Indications", "indications", card.indications);
    html += bulletBox("Contraindications", "contra", card.contraindications);
    html += blocksBox("Steps", "steps", card.steps);
    html += bulletBox("Documentation", "docs", card.documentation);
    html += bulletBox("Discharge Advice", "discharge", card.discharge);
    html += resourcesBox(card.resources);
    html += `<div class="pin-box" id="askPanel" style="margin-top:18px;"></div>`;
    c.innerHTML = html;
    renderAskPanel(card);
  }

  if(state.view==="qa"){
    const card = CARDS.find(x=>x.id===state.qaCardId);
    title.textContent = "Questions & Answers";
    let html = `<div class="back-row" onclick="openCard('${card.id}')">‹ Back to card</div>
      <div class="detail-cat">${catById(card.catId).name}</div>
      <div class="detail-title">${escapeHtml(card.title)}</div>
      <div class="section-label">Answered questions</div>`;
    const answered = state.questions.filter(q=>q.cardId===card.id && q.status==="Answered").slice().reverse();
    if(answered.length===0){ html += `<div class="empty">No answered questions yet for this card.</div>`; }
    answered.forEach(q=>{
      html += `<div class="qa-item">
        <div class="qtext">${escapeHtml(q.question)}</div>
        <div class="qmeta">Asked ${q.dateSubmitted}</div>
        <div class="qanswer"><div class="qalabel">Answer</div>${escapeHtml(q.answer)}
          <div class="qmeta" style="margin-top:4px;">Answered ${q.dateAnswered}</div></div>
      </div>`;
    });
    c.innerHTML = html;
  }

  if(state.view==="verifyGate"){
    title.textContent = "Lead / Educator Access";
    c.innerHTML = `<div class="back-row" onclick="goHome()">‹ Cards</div>
      <div class="pin-box">
        <h3>Check &amp; answer questions</h3>
        <p>This area is restricted to leads and educators. Enter the access PIN to continue.</p>
        <div class="field"><label>Access PIN</label><input id="pinInput" type="password" inputmode="numeric" placeholder="••••"></div>
        <button class="btn btn-primary" onclick="checkPin()">Continue</button>
      </div>`;
  }

  if(state.view==="answerQuestions"){
    title.textContent = "Answer Questions";
    if(!state.educatorLoaded){ c.innerHTML = `<div class="back-row" onclick="goHome()">‹ Cards</div><div class="loading">Connecting…</div>`; return; }
    if(!state.educatorOk){
      c.innerHTML = `<div class="back-row" onclick="goHome()">‹ Cards</div>
        <div class="empty">Question data isn't connecting right now.
        <div style="margin-top:10px;"><span style="text-decoration:underline;cursor:pointer;" onclick="loadEducatorView()">Try again</span></div></div>`;
      return;
    }
    const pending = state.pending;
    let html = `<div class="back-row" onclick="goHome()">‹ Cards</div>
      <div class="section-label">${pending.length} awaiting an answer</div>`;
    if(pending.length===0){ html += `<div class="empty">Nothing pending right now.</div>`; }
    pending.slice().reverse().forEach(entry=>{
      html += `<div class="verify-row">
        <div class="vtitle">${escapeHtml(entry.cardTitle)}</div>
        <div class="vmeta">Asked by ${escapeHtml(entry.staffName)} on ${entry.dateSubmitted}</div>
        <div class="qtext">${escapeHtml(entry.question)}</div>
        <div class="field" style="margin-top:10px;"><label>Your name (answering)</label><input id="answerer-${entry.qId}" type="text" placeholder="e.g. Caitlin"></div>
        <div class="field"><label>Your answer</label><textarea id="answer-${entry.qId}" rows="3" placeholder="Type your answer…"></textarea></div>
        <button class="btn btn-primary" onclick="answerQuestion('${entry.qId}')">Submit answer</button>
      </div>`;
    });
    c.innerHTML = html;
  }
}

function renderAskPanel(card){
  const panel = document.getElementById("askPanel");
  if(!state.loaded){
    panel.innerHTML = `<h3>Questions</h3><div class="vmeta">Connecting…</div>`;
    return;
  }
  if(!state.storageOk){
    panel.innerHTML = `<h3>Questions</h3>
      <div class="vmeta">Question submission isn't connecting right now — the rest of the card still works fine. <span style="text-decoration:underline;cursor:pointer;" onclick="retryQuestions('${card.id}')">Try again</span></div>`;
    return;
  }
  let html = `<h3>Questions</h3>`;
  if(state.askFormOpenFor === card.id){
    html += `
      <div class="field"><label>Your name</label><input id="askName" type="text" placeholder="e.g. Caitlin"></div>
      <div class="field"><label>Your question</label><textarea id="askQuestion" rows="3" placeholder="What would you like to ask about this card?"></textarea></div>
      <button class="btn btn-primary" onclick="submitQuestion('${card.id}')">Submit question</button>
      <div class="footer-link" onclick="closeAskForm('${card.id}')">Cancel</div>`;
  } else {
    html += `<p>Have a question about this action card? A lead or educator will answer it.</p>
      <button class="btn btn-primary" onclick="openAskForm('${card.id}')">Ask a question about this card</button>`;
  }
  const answeredCount = state.questions.filter(q=>q.cardId===card.id && q.status==="Answered").length;
  if(answeredCount){
    html += `<div class="footer-link" style="margin-top:14px;" onclick="openCardQA('${card.id}')">View ${answeredCount} answered question${answeredCount===1?'':'s'} for this card</div>`;
  }
  panel.innerHTML = html;
}
async function retryQuestions(cardId){
  state.loaded = false;
  if(document.getElementById("askPanel")) renderAskPanel(CARDS.find(x=>x.id===cardId));
  await loadQuestions();
}
function openAskForm(cardId){
  state.askFormOpenFor = cardId;
  renderAskPanel(CARDS.find(x=>x.id===cardId));
}
function closeAskForm(cardId){
  state.askFormOpenFor = null;
  renderAskPanel(CARDS.find(x=>x.id===cardId));
}
async function submitQuestion(cardId){
  const nameInput = document.getElementById("askName");
  const questionInput = document.getElementById("askQuestion");
  const name = nameInput.value.trim();
  const question = questionInput.value.trim();
  if(!name){ showToast("Enter your name first."); return; }
  if(!question){ showToast("Enter your question first."); return; }
  const card = CARDS.find(x=>x.id===cardId);
  try{
    const res = await withTimeout(fetch(QUESTIONS_API, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ staffName: name, cardId: card.id, cardTitle: card.title, question }),
    }), 5000);
    if(!res.ok) throw new Error("bad response");
    showToast("Question submitted.");
    state.askFormOpenFor = null;
    renderAskPanel(card);
  }catch(e){
    showToast("Could not submit — question data isn't connecting right now.");
  }
}

function goAnswerGate(){
  if(state.pinOk){ state.view="answerQuestions"; loadEducatorView(); }
  else { state.view="verifyGate"; render(); }
}
async function checkPin(){
  const val = document.getElementById("pinInput").value.trim();
  if(!val){ showToast("Enter the PIN."); return; }
  state.pin = val;
  state.pinOk = true;
  state.view = "answerQuestions";
  await loadEducatorView();
}
async function loadEducatorView(){
  state.educatorLoaded = false;
  if(state.view==="answerQuestions") render();
  try{
    const result = await loadPendingForEducator(state.pin);
    if(!result.ok && result.reason==="pin"){
      state.pinOk = false; state.pin = "";
      state.educatorLoaded = true;
      state.view = "verifyGate";
      render();
      showToast("Incorrect PIN.");
      return;
    }
    state.educatorOk = result.ok;
  }catch(e){
    state.educatorOk = false;
  }
  state.educatorLoaded = true;
  render();
}

async function answerQuestion(qId){
  const nameInput = document.getElementById("answerer-"+qId);
  const answerInput = document.getElementById("answer-"+qId);
  const answerer = nameInput ? nameInput.value.trim() : "";
  const answer = answerInput ? answerInput.value.trim() : "";
  if(!answerer){ showToast("Enter your name to answer."); return; }
  if(!answer){ showToast("Enter an answer first."); return; }
  try{
    const res = await withTimeout(fetch(QUESTIONS_API, {
      method: "PATCH", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pin: state.pin, qId, answeredBy: answerer, answer }),
    }), 5000);
    if(!res.ok) throw new Error("bad response");
    showToast("Answer submitted.");
    await loadEducatorView();
    await loadQuestions();
  }catch(e){
    showToast("Could not submit answer — question data isn't connecting right now.");
  }
}

function openCategory(id){ state.view="list"; state.catId=id; state.searchTerm=""; render(); }
function openCard(id){ state.view="detail"; state.cardId=id; render(); }
function openCardQA(cardId){ state.view="qa"; state.qaCardId=cardId; render(); }
function openAllQA(){ state.view="allQuestions"; render(); }
function goHome(){ state.view="home"; state.catId=null; state.searchTerm=""; render(); }
function goBackToList(){ state.view = state.catId || state.searchTerm ? "list" : "home"; render(); }
function onSearch(val){
  state.searchTerm = val; state.catId = null;
  state.view = val.trim()==="" ? "home" : "list";
  render();
  const el = document.getElementById("searchInput");
  if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}

(function init(){
  render();
  loadQuestions();
})();
</script>
</body>
</html>
