<style>
  :root{
    --navy:#12293B; --navy-2:#1B3A52; --teal:#1E6E7A;
    --paper:#F6F7F5; --card-bg:#FFFFFF; --ink:#16232C; --ink-soft:#5B6C76; --line:#E2E6E4;
    --red:#B0342B; --red-bg:#FBECEA;
    --blue:#1F5C8B; --blue-bg:#EAF2FA;
    --green:#2E7D4F; --green-bg:#EAF6EE;
    --orange:#B5691A; --orange-bg:#FCF1E4;
    --purple:#5B4B8A; --purple-bg:#F0EDF7;
    --grey-bg:#EEF0EE;
    --mint:#0F766E; --mint-bg:#E3F3F1;
    --slate:#475569; --slate-bg:#EEF1F4;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;}
  .phone{max-width:460px;margin:0 auto;min-height:100vh;background:var(--paper);display:flex;flex-direction:column;}

  .topbar{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;padding:16px 16px 14px;position:sticky;top:0;z-index:20;}
  .topbar .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9FC3D1;font-weight:600;margin-bottom:2px;}
  .topbar h1{margin:0 0 12px;font-size:20px;font-weight:700;letter-spacing:-0.01em;}
  .search-wrap{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.22);border-radius:10px;display:flex;align-items:center;padding:10px 12px;gap:8px;}
  .search-wrap input{background:transparent;border:none;outline:none;color:#fff;font-size:15px;width:100%;}
  .search-wrap input::placeholder{color:#B9CCD4;}
  .back-row{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);border-radius:20px;padding:7px 14px 7px 12px;cursor:pointer;width:fit-content;margin-bottom:14px;box-shadow:0 2px 6px rgba(0,0,0,0.15);transition:opacity .1s;}
  .back-row:hover{opacity:.88;}
  .back-row:active{opacity:.75;}

  .content{flex:1;padding:16px 16px 90px;}
  .section-label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin:4px 2px 10px;}
  .cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px;}
  .cat-tile{background:var(--card-bg);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;position:relative;overflow:hidden;transition:transform .1s;}
  .cat-tile:active{transform:scale(.97);}
  .cat-tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--bar,var(--teal));}
  .cat-tile .cname{font-size:15px;font-weight:700;color:var(--navy);}
  .cat-tile .ccount{font-size:12px;color:var(--ink-soft);margin-top:4px;}

  .card-row{background:var(--card-bg);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:9px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;gap:10px;}
  .card-row .ctitle{font-size:15px;font-weight:600;color:var(--ink);}
  .card-row .csub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .chev{color:var(--ink-soft);font-size:18px;flex-shrink:0;}
  .badge{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;letter-spacing:.02em;white-space:nowrap;}
  .badge.flag{background:var(--red-bg);color:var(--red);}

  .detail-title{font-size:22px;font-weight:800;color:var(--navy);margin:2px 0 4px;letter-spacing:-0.01em;}
  .detail-cat{font-size:12px;color:var(--teal);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px;}
  .overview{font-size:14.5px;line-height:1.55;color:var(--ink);margin-bottom:16px;}
  .overview p{margin:0;}
  .overview ul{margin:0;padding-left:20px;}
  .overview li{margin-bottom:8px;}
  .overview li:last-child{margin-bottom:0;}
  .box{border-radius:10px;padding:13px 14px 14px;margin-bottom:11px;}
  .box .box-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px;display:flex;align-items:center;gap:6px;}
  .box ul, .box ol{margin:0;padding-left:19px;font-size:13.8px;line-height:1.55;}
  .box li{margin-bottom:4px;}
  .box li:last-child{margin-bottom:0;}
  .box .sub-heading{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin:8px 0 4px;color:inherit;opacity:.85;}
  .box .sub-heading:first-child{margin-top:0;}
  .box.critical{background:var(--red-bg);} .box.critical .box-label{color:var(--red);}
  .box.signs{background:var(--blue-bg);} .box.signs .box-label{color:var(--blue);}
  .box.drugs{background:var(--green-bg);} .box.drugs .box-label{color:var(--green);}
  .box.equipment{background:var(--orange-bg);} .box.equipment .box-label{color:var(--orange);}
  .box.steps{background:#EAF0F5;} .box.steps .box-label{color:var(--navy);}
  .box.indications{background:#E7F4F2;} .box.indications .box-label{color:#146356;}
  .box.contra{background:var(--purple-bg);} .box.contra .box-label{color:var(--purple);}
  .box.docs{background:var(--grey-bg);} .box.docs .box-label{color:var(--ink-soft);}
  .box.ask{background:var(--slate-bg);} .box.ask .box-label{color:var(--slate);}
  .box.discharge{background:var(--mint-bg);} .box.discharge .box-label{color:var(--mint);}
  .box.resources{background:#EFF3F6;} .box.resources .box-label{color:var(--navy);}
  .box.resources a{color:#1F5C8B;text-decoration:underline;text-decoration-style:dotted;}
  .resources-empty{font-size:12.5px;color:var(--ink-soft);font-style:italic;}
  .dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block;}
  .needs-content{background:var(--red-bg);color:var(--red);font-size:12.5px;font-weight:700;padding:10px 12px;border-radius:8px;margin-bottom:14px;}

  .empty{text-align:center;color:var(--ink-soft);font-size:14px;padding:40px 10px;}
  .loading{text-align:center;color:var(--ink-soft);font-size:13px;padding:20px 10px;}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;font-size:13.5px;font-weight:600;z-index:50;box-shadow:0 4px 14px rgba(0,0,0,.2);}

  .footer-link{text-align:center;font-size:12px;color:var(--ink-soft);padding:10px 0 4px;cursor:pointer;text-decoration:underline;}
  .pin-box{background:var(--card-bg);border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:10px;}
  .pin-box h3{margin:0 0 6px;font-size:15px;color:var(--navy);}
  .pin-box p{margin:0 0 14px;font-size:12.5px;color:var(--ink-soft);line-height:1.5;}
  .field{margin-bottom:10px;}
  .field label{font-size:12px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:4px;}
  .field input{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none;}
  .field input:focus{border-color:var(--teal);}
  .btn{width:100%;padding:12px;border-radius:9px;border:none;font-size:14.5px;font-weight:700;cursor:pointer;}
  .btn:disabled{background:#C7CDCF !important;cursor:default;}
  .btn-primary{background:var(--navy);color:#fff;}
  .verify-row{background:var(--card-bg);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;}
  .verify-row .vtitle{font-weight:700;font-size:14.5px;color:var(--navy);}
  .verify-row .vmeta{font-size:12px;color:var(--ink-soft);margin:3px 0 10px;}
  .verify-row .qtext{font-size:13.5px;color:var(--ink);margin:6px 0;}
  .field textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none;font-family:inherit;resize:vertical;}
  .field textarea:focus{border-color:var(--teal);}
  .qa-item{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
  .qa-item .qtext{font-size:13.5px;color:var(--ink);font-weight:600;}
  .qa-item .qmeta{font-size:11.5px;color:var(--ink-soft);margin-top:3px;display:flex;align-items:center;gap:6px;}
  .qa-item .qanswer{font-size:13px;color:var(--ink);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);}
  .qa-item .qanswer .qalabel{font-weight:700;color:var(--teal);font-size:11px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;}
  .badge.pending{background:var(--grey-bg);color:var(--ink-soft);}
  .badge.answered{background:var(--green-bg);color:var(--green);}
  .expiry-banner{background:#FCEFC7;color:#6B4E00;border-bottom:1px solid #E8CE7A;font-size:12.5px;font-weight:600;line-height:1.4;padding:9px 16px;text-align:center;}
</style>

ating in heart tissue rather than the ventricles, via an accessory conduction pathway.", "overviewBlocks": [], "critical": ["Signs of shock", "May require DCCV", "Modified Valsalva manoeuvre (head down, feet up >30 seconds)"], "signs": ["Lightheadedness", "shortness of breath", "hypotension", "chest pain", "weakness"], "drugs": ["Adenosine IV if vagal manoeuvres unsuccessful", "If Adenosine unsuccessful", "may require DCCV"], "equipment": ["Catheter tip syringe", "ECG", "defibrillator with ECG stickers and pads", "BP monitoring (opposite arm from IV if giving adenosine)"], "steps": [{"heading": "", "ordered": false, "items": ["Vagal manoeuvres first: Valsalva (bearing down)", "blowing into a syringe then raising legs above head", "carotid sinus massage", "coughing", "applied abdominal pressure"]}, {"heading": "", "ordered": false, "items": ["If unsuccessful, IV Adenosine — prepare patient for an overwhelming feeling of impending doom from the pause/bradycardia; ensure NIBP cycling every 2 min, BP cuff on opposite arm, defib on and ready to print rhythm strip"]}, {"heading": "", "ordered": false, "items": ["If Adenosine unsuccessful, DCCV (min. conscious sedation): attach ECG electrodes in standard positions; apply defib pads to maximise transmyocardial current; set defibrillator to SYNCHRONISED shock (coincides with R wave — unsynchronised risks VF via T-wave coincidence, look for 'Sync' label and white R-wave marks); ensure chest dry, no one in contact with patient, remove free-flowing O2; charge and press/hold shock button until delivered"]}], "indications": [], "contraindications": [], "documentation": [], "needsContent": false}, {"id": "CARD004", "catId": "CAT01", "title": "Atrial Fibrillation", "overview": "AF: the atria beat chaotically and irregularly, out of coordination with the ventricles, causing poor blood flow. May be infection-driven, chronic or paroxysmal, often linked to underlying heart disease. Because atria beat rapidly/irregularly, blood flows th ry oedema may be the first presentation of heart failure or an exacerbation of known heart failure, or secondary to AF, other tachy/bradycardia, critical cardiac ischaemia, valvular disease or renal artery stenosis. CPAP increases intrathoracic pressure (reduces preload via decreased venous return) and lowers afterload (increasing the LV–extrathoracic artery pressure gradient, contributing to increased stroke volume). Consider intubation for persistent hypoxaemia/hypercapnia despite O2, morphine, diuretics and vasodilators, or for apnoea/profound respiratory depression (RR <10).", "overviewBlocks": [], "critical": ["BP <90mmHg (may drop further once CPAP starts)", "Pneumothorax", "Type 2 respiratory failure"], "signs": ["Lower airway obstruction (pulmonary oedema, asthma, COPD, anaphylaxis, malpositioned ETT); other causes of increased airway pressure"], "drugs": ["Morphine", "IV Furosemide (or, if already on oral diuretics, double the normal oral dose IV; repeat bolus 30min-1hr, double dose at first repeat; if further diuretic needed refer to senior medical staff immediately)", "Glyceryl trinitrate IV", "titrated to BP", "only if systolic BP >90mmHg (see local dosing charts)"], "equipment": ["CPAP box", "appropriate fitting mask", "ECG monitoring", "30L O2 connection", "consider catheterisation for fluid balance", "NIBP every 15 minutes"], "steps": [{"heading": "", "ordered": true, "items": ["Sit patient upright", "Ensure mask fits correctly (not over chin, not covering eyes)", "Two-operator mask fitting", "Ensure mask straps sit symmetrical", "Start with bottom connections", "Connect top head straps", "Attach tubing to face mask", "Attach opposite side to 30L O2 port", "Attach pressure gauge to mask", "Turn up O2 flow meter until 5mmHg reading on pressure gauge", "PEEP can be increased (up to 10mmHg) by increasing O2 flow rate"]}], "indications": [], "contraindications": [], "documentation": [], "needsContent": false}, {"id": "CARD007", "catId": "CAT01", "title": m away from ICD/PPM battery", "Potential for VF"], "signs": [], "drugs": ["Conscious sedation drugs: Midazolam", "Propofol", "Ketamine", "Fentanyl", "Alfentanil"], "equipment": ["ECG monitoring", "defibrillator", "monitoring set to 2-minute BP cycles if NIBP"], "steps": [{"heading": "", "ordered": true, "items": ["Charge and press/hold shock button until delivered (slight delay possible)"]}], "indications": [], "contraindications": [], "documentation": [], "needsContent": false}, {"id": "CARD011", "catId": "CAT02", "title": "Ruptured Ectopic Pregnancy", "overview": "An ectopic pregnancy is when a fertilised egg implants outside the womb, usually in a fallopian tube, where it cannot develop into a baby. Rupture is often associated with profound haemorrhage, which may be fatal without rapid surgical intervention.", "overviewBlocks": [], "critical": ["Ectopic pregnancy is the leading cause of 1st trimester maternal death", "Be prepared for major haemorrhage", "May be taken straight to theatre"], "signs": ["Shoulder pain (diaphragmatic irritation from free blood in peritoneal space)", "hypotension", "tachycardia", "shock", "lightheadedness/syncope", "cool pale skin", "nausea/vomiting", "severe abdominal pain"], "drugs": ["TXA", "analgesia", "O-negative blood"], "equipment": ["Belmont", "speculum", "forceps and sponges/sterile swabs"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "needsContent": false}, {"id": "CARD012", "catId": "CAT02", "title": "PV Bleeding / PV Bleeding in Pregnancy", "overview": "Assess severity: frequency of pad change (soaking <20 min = severe), passing clots (size), and in pregnancy any products of conception (POC) — important to remove for further testing — and length of time bleeding. Causes are structural (polyps, adenomyosis, fibroids, malignancy/hyperplasia), non-structural (coagulopathy, ovulatory dysfunction/DUB, extremes of reproductive age, endocrinopathy, PCOS, endometrial cyclical menorrhagia, devices e.g. IUD/retained tampon, drugs e.g. anticoagulants/chemo/corticosteroids/OCP/HRT/tamoxifen) or not-yet-classified (trauma, AVM, PID especially endometritis, vaginal atrophy, illness). Also consider miscarriage or medical termination of pregnancy (MTOP).", "overviewBlocks": [], "critical": ["Ectopic pregnancy is the leading cause of 1st trimester maternal death", "Be prepared for major haemorrhage", "May be taken straight to theatre", "Cervical shock can cause bradycardia", "Remove any POC from the cervical os"], "signs": ["Abdominal cramping, lower back pain, RIF/LIF pain, bleeding when wiping, spotting, presence of clots, colour of bleeding"], "drugs": ["TXA", "analgesia", "O-negative blood"], "equipment": ["Belmont", "speculum", "forceps and sponges/sterile swabs", "POC pot (found in sluice)"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "needsContent": false}, {"id": "CARD013", "catId": "CAT03", "title": "DKA", "overview": "Prioritise fluid replacement; 2x IV access points may be essential. Beware T2DM patients on SGLT2 inhibitors — these can cause DKA in T2DM even without marked hyperglycaemia. Severe uncontrolled diabetes with: hyperglycaemia (usually blood glucose >14mmol/L), metabolic acidosis (H+ >45mEq/L or HCO3- <18mmol/L or pH <7.3 on venous gas), ketonaemia (>3mmol/L)/ketonuria (>++). Acidosis shifts potassium out of cells, so serum K initially rises even though total-body K is falling as kidneys dump K. Correcting the acidosis pulls K back into K-depleted cells, so critically low K+ (and arrhythmia risk) is common during treatment. Severe hyperkalaemia is uncommon but can result from acidosis, insulin deficiency, hyperosmolality, severe dehydration and renal K retention — insulin deficiency in DKA moves K out of cells, raising plasma K despite total-body deficiency.", "overviewBlocks": [], "critical": ["Hyperkalaemia in severe DKA", "Prioritise ECG", "Potassium replacement at a rate <20mmol/hour of KCl", "Repeat VBGs", eed originates from.", "overviewBlocks": [], "critical": ["Emergency O-negative in fridge", "Major haemorrhage — call 2222"], "signs": ["Upper: haematemesis (visible fresh red blood)", "coffee-ground (dark) vomit", "melena (black tarry stools from upper GI blood)", "Lower: fresh PR blood passed only with stool, or without stool (usually lower GI but may reflect rapid transit from upper GI)"], "drugs": ["O-negative", "TXA", "For variceal bleeds: Co-amoxiclav", "Terlipressin", "Vitamin K", "reverse anticoagulants"], "equipment": ["Belmont", "fluid balance", "cardiac monitoring", "NIBP"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "needsContent": false}, {"id": "CARD016", "catId": "CAT03", "title": "Hypo/Hyperkalaemia", "overview": "Potassium facilitates muscle contraction (including cardiac) and helps control fluid balance; 98% of total potassium stores are intracellular, generating a concentration gradient critical to cellular excitability and function. Hypokalaemia causes: vomiting/diarrhoea, excessive alcohol use, CKD, DKA, diuretics, excessive laxative use, excessive sweating, eating disorders, primary aldosteronism, some antibiotics. Hyperkalaemia causes: CKD, AKI, medications (beta-blockers, ACEi), dehydration, severe burns, Addison's, acidosis.", "overviewBlocks": [], "critical": ["ECG changes", "Check blood sugar prior to Insulin/Glucose", "Consider as a cause of cardiac arrest"], "signs": ["Muscle twitches", "fatigue", "peaked T waves/T wave tenting (hyper)", "ST depression/T wave inversion (hypo)"], "drugs": ["Calcium chloride", "Calcium gluconate", "Insulin/Glucose"], "equipment": ["ECG", "cardiac monitoring", "blood glucose monitoring every 15 minutes post insulin/dextrose"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "needsContent": false}, {"id": "CARD017", "catId": "CAT03", "title": "Hyperglycaemic Hyperosmolar State (HHS)", "overview": "HHS occurs when very high blood sugar leads to severe dehydration and highly concentrated blood (high osmolality) — life-threatening. There's a lack of insulin, but usually enough to prevent ketone production; there is often an underlying condition (e.g. infection) also driving the high blood sugar. HHS carries significantly higher morbidity/mortality than DKA. Fluid losses estimated 10-22L in a 100kg person. HHS has a slower onset than DKA, usually without urgent need to clear ketoacidosis, and occurs in patients whose brains are at higher risk of injury from rapid shifts in sodium/glucose — so HHS needs less aggressive fluid resuscitation and glucose-lowering than DKA. Differentiating HHS from DKA is harder with severe intercurrent illness (e.g. SGLT2i/fasting ketosis, AKI-related nonketotic acidosis) — seek early specialist input if the diagnosis (HHS vs DKA vs both) is unclear.", "overviewBlocks": [], "critical": ["GCS changes", "Potassium monitoring"], "signs": ["Extreme thirst, confusion"], "drugs": ["NaCl 0.9%", "potassium replacement if required", "Insulin"], "equipment": ["Cardiac monitoring", "blood sugar monitoring", "ECG", "fluid balance"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "needsContent": false}, {"id": "CARD018", "catId": "CAT04", "title": "Bi-PAP / NIV (Non-Invasive Ventilation)", "overview": "BiPAP delivers different pressure levels during inspiration (IPAP) and expiration (EPAP), and is effective in reducing mortality and need for tracheal intubation in acute decompensated COPD. Physiological criteria: decompensated type 2 respiratory failure (pH <7.35 / H+ >45mmol/L and pCO2 >6kPa); on maximum medical therapy for ≥1hr (nebulised salbutamol PRN, corticosteroids, antibiotics if appropriate, controlled FiO2 — usually 28% venturi, aiming SpO2 86-90% — and reversal of respiratory depressants); moderate-to-severe dyspnoea, RR >25bpm.", "overviewBlocks": [], "critical": ["Good fitting mask (2-person placement technique)", "Reducing O2", "Repeat ABG at 1hr (and as per patient's condition after)"], "signs": ["Reduced GCS, reduced or increased RR"], "drugs": ["Salbutamol (nebuliser 5mg; IV bolus 250mcg diluted, slowly; IV infusion 5-20mcg/min)", "Ipratropium (nebuliser 0.5mg)", "Magnesium 2g over 10 minutes"], "equipment": ["ECG monitoring", "NIBP (monitor for hypotension)", "NIV machine (O2 connected to back)", "tubing for machine and O2", "appropriate fitting mask"], "steps": [{"heading": "", "ordered": true, "items": ["Size for face mask (smallest that fits comfortably; small leaks OK but not into eyes)", "Position patient in bed/chair at >30° angle", "NIV settings on ST (self-triggered): IPAP 10cmH2O, EPAP 4cmH2O, RATE 12bpm (activates if patient apnoeic). Oxygen: if supplementary O2 required, set at 4L/min and titrate to SpO2 88-92%. Increase IPAP in 2cmH2O increments to max tolerated (usually not more than 20cmH2O)"]}], "indications": [], "contraindications": [], "documentation": ["NIV chart, ABGs, TEP, discussion with medical registrar"], "needsContent": false}, {"id": "CARD019", "catId": "CAT04", "title": "COPD (Chronic Obstructive Pulmonary Disease)", "overview": "COPD is a group of lung conditions causing breathing difficulties, including emphysema (air sac damage) and chronic bronchitis (long-term airway inflammation); commonly affects middle-aged/older adults who smoke. Type 1 respiratory failure = inadequate oxygenation → hypoxaemia. Type 2 respiratory failure = inadequate CO2 removal → hypercapnia.", "overviewBlocks": [], "critical": ["CO2 retention", "Reduced GCS"], "signs": ["Wheeze", "dyspnoea", "chronic cough", "productive cough"], "drugs": ["Nebulisers (air-driven): Salbutamol", "Ipratropium", "Steroids"], "equipment": ["NIV", "ECG", "cardiac monitoring", "nebulisers"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "needsContent": false}, {"id": "CARD020", "catId": "CAT05", "title": "Thomas Splint", "overview": "Used to stabilise a fractured femur with skin traction.", "overviewBlocks": [], "critical": ["Adequate analgesia is important — consider FIB (fascia iliaca block) if not contraindicated", "Catheterisation for females prior to splint", "Be aware of splint causing irritation and pressure damage at the groin"], "signs": [], "drugs": [], "equipment": ["Thomas splint", "TubiGrip", "SoffBan", "large gauze", "Tensoplast skin traction", "2x tongue depressors wrapped in fabric tape", "clear medical tape", "razor", "scissors", "measuring tape"], "steps": [{"heading": "", "ordered": true, "items": ["Measure thigh diameter and select appropriately fitting Thomas splint", "Cut appropriate length of tubigrip and place over splint", "Apply skin traction, peel tape and attach to skin of inner and outer thigh (use razor if needed)", "Secure traction by wrapping with included bandage and tape to secure", "Add layer of soffban", "Place padding behind knee", "Place Thomas splint under leg with tubigrip under leg — hard brace under leg, soft brace over top"]}, {"heading": "TRACTION STRING", "ordered": true, "items": ["Left end of tie over left side of splint", "Right end of tie under right side of splint", "Wrap around bottom end of splint", "Left side over", "Right side under", "Complete knot at end of splint", "Place tongue depressor between string", "Twist until taut", "Wrap splint in gauze", "Heel should hang over bed"]}], "indications": [], "contraindications": [], "documentation": [], "needsContent": false, "resources": [{"label": "St Mungo's ED Guideline", "url": "https://stmungos-ed.com/orthopaedics/thomassplint"}]}, {"id": "CARD021", "catId": "CAT05", "title": "NOF # (Neck of Femur Fracture)", "overview": "A fractured neck of femur (broken hip) is a serious, often life-changing and sometimes life-threatening injury in older people, occurring when the top of the femur breaks just below the ball-and-socket joint. Two main types: Intracapsular (ball breaks off at the junction with the femoral neck, within the hip joint — occasionally re-attached, but usually replaced with a hemiarthroplasty or total hip replacement); Extracapsular (break further down the femur, outside the hip joint, fixed with metalwork). Pressure area care is important given severely impacted mobility.", "overviewBlocks": [], "critical": ["Important to fully examine the patient's limb — potential for a mid-shaft femur fracture to be missed if not properly undressed", "Pressure area care", "Midshaft femur fracture is more likely in patients with an oncology history"], "signs": ["Shortening of the affected limb, internal or external rotation"], "drugs": ["Oramorph", "IV fluids", "consider need for FIB"], "equipment": ["4AT regardless of age", "Big 6", "heel protection", "ECG", "cardiac monitoring and regular NIBPs if FIB given", "Repose mattress"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "needsContent": false}, {"id": "CARD022", "catId": "CAT05", "title": "Fascia Iliaca Block (FIB)", "overview": "FIBs are part of the 'Big 6' in NOF fracture management in the ED — be familiar with the recent RCEM safety alert on opiate-associated apnoea and the importance of ED observations for 30 minutes post-procedure. Local anaesthetic injected into the fascia iliaca compartment spreads to the femoral and lateral femoral cutaneous nerves supplying the medial, anterior and lateral thigh, providing analgesia in ED and ongoing benefit on the ward when the patient is turned for pressure area care.", "overviewBlocks": [], "critical": ["Opiate-related apnoea", "Local anaesthetic toxicity"], "signs": [], "drugs": [], "equipment": ["ECG monitoring", "NIBP (cycle every 5 minutes)"], "steps": [], "indications": [], "contraindications": ["Agitation", "DOAC", "Warfarin"], "documentation": ["Big 6 proforma", "4AT", "pressure areas"], "needsContent": false}, {"id": "CARD023", "catId": "CAT05", "title": "Limb Reduction", "overview": "Required to stabilise an unstable joint/fracture (the limb may also be fractured but dislocated, needing reduction). Adequate sedation/analgesia is essential — tense muscles impede reduction. Good Penthrox technique is essential; if Penthrox is contraindicated or unsuccessful, conscious sedation is required. Depending on the site of dislocation/fracture, may need POP/back slab, broadarm sling (Lancaster sling), knee splint (Buchanan splint), or humeral brace.", "overviewBlocks": [], "critical": ["Have counter-traction prepared for shoulders", "Be prepared for apnoea — BVM correctly assembled"], "signs": [], "drugs": ["Penthrox", "conscious sedation", "NaCl 0.9%"], "equipment": ["CO2 monitoring", "fluids", "trauma mask", "sling", "sedation drugs", "sedation proforma", "pre/mid/post-sedation observations", "plaster trolley"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "needsContent": false}, {"id": "CARD024", "catId": "CAT06", "title": "Croup / Wheeze", "overview": "NEEDS CONTENT — this card was a blank placeholder (definition and checklist to prepare) in the source document. Fill in locally before publishing to staff.", "overviewBlocks": [], "critical": [], "signs": [], "drugs": [], "equipment": [], "steps": [], "indications": [], "contraindications": [], "documentation": [], "needsContent": true}, {"id": "CARD025", "catId": "CAT06", "title": "Febrile Convulsions", "overview": "NEEDS CONTENT — this card was a blank placeholder (definition and checklist to prepare) in the source document. Fill in locally before publishing to staff.", "overviewBlocks": [], "critical": [], "signs": [], "drugs": [], "equipment": [], "steps": [], "indications": [], "contraindications": [], "documentation": [], "needsContent": true}, {"id": "CARD026", "catId": "CAT07", "title": "Anaphylaxis", "overview": "A severe, life-threatening, generalised/systemic hypersensitivity reaction, characterised by rapidly developing life-threatening airway (pharyngeal/laryngeal oedema), breathing (bronchospasm, tachypnoea) and/or circulation (hypotension, tachycardia) problems, usually with skin/mucosal changes. A patient can have anaphylaxis without urticaria or mucosal signs; in patients with known allergies it may present as isolated hypotension. Early recognition and treatment matters — delayed adrenaline is linked to increased mortality and biphasic reactions.", "overviewBlocks": [], "critical": ["Prepare for RSI if airway compromised", "Stridor"], "signs": ["Angioedema", "stridor", "respiratory distress", "bronchospasm", "hypotension and cardiovascular collapse", "abdominal cramps", "diarrhoea", "flushing or pallor", "urticaria", "coagulopathy"], "drugs": ["Adrenaline — IM 0.5mg (1:1,000)", "or nebulised (1:1000) 1ml diluted with NaCl 0.9% to 5ml", "Fluids"], "equipment": ["ECG", "cardiac monitoring", "high-flow O2", "NIBP"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "needsContent": false}, {"id": "CARD027", "catId": "CAT07", "title": "Surgical Airway (FONA)", "overview": "Indicated when there is no appropriate alternative means of oxygenating/ventilating a patient. Types: tracheostomy or cricothyroidotomy. Situations include: failed bag-mask ventilation, failed extraglottic airway and failed tracheal intubation; limited upper airway access due to entrapment; inability to attempt airway patency manoeuvres via nose/mouth due to massive facial trauma or burns.", "overviewBlocks": [], "critical": ["Can't Intubate Can't Ventilate (CICV)"], "signs": [], "drugs": ["Antiseptic", "Lidocaine/adrenaline", "Ketamine (if conscious)"], "equipment": ["#11 scalpel", "bougie", "cuffed 6.0 ETT or Portex 6.0 mini-trach", "suction"], "steps": [{"heading": "", "ordered": true, "items": ["Scalpel", "Finger", "Bougie", "ETT", "Ventilate"]}], "indications": [], "contraindications": [], "documentation": [], "needsContent": false}, {"id": "CARD028", "catId": "CAT07", "title": "Thoracotomy", "overview": "Split into two teams — one to resuscitate the patient, one to perform the thoracotomy.", "overviewBlocks": [], "critical": ["Life-saving procedure", "Clamshell approach"], "signs": [], "drugs": ["O-negative blood", "RSI drugs"], "equipment": ["Thoracotomy tray from trauma trolley"], "steps": [{"heading": "TEAM 1", "ordered": true, "items": ["Grab thoracotomy tray from trauma trolley", "Sterile gloves, gowns and masks", "Size 22 scalpel", "Standard suture pack", "Sterile tuff-cut scissors", "Position patient with L arm out of the way", "'Baptise' with betadine"]}, {"heading": "TEAM 2", "ordered": true, "items": ["Intubate (26cm, deep into R main bronchus)", "Venous access (R subclavian or right humeral IO)", "Fluid resuscitation (call 2222 major haemorrhage)", "R-sided chest drain"]}], "indications": [], "contraindications": [], "documentation": [], "needsContent": false}, {"id": "CARD029", "catId": "CAT07", "title": "Needle Decompression / Finger Thoracostomy", "overview": "An emergent procedure for tension pneumothorax, caused by injured tissue creating a one-way valve into the pleural space. Gas accumulates under pressure — untreated, it causes respiratory insufficiency and prevents venous return, leading to cardiovascular collapse and death. Needle thoracostomy provides an escape route for trapped gas, reducing pressure and allowing greater venous return, but is not a definitive treatment (only arrests progression). Finger thoracostomy is the same concept but provides a larger hole for gas or blood to escape.", "overviewBlocks": [], "critical": ["Life-saving procedure"], "signs": ["Early tension pneumothorax: chest pain", "SOB", "tachypnoea", "tachycardia", "reduced breath sounds on affected side", "hyper-resonance on affected side", "Late: distended neck veins", "cyanosis/hypoxia", "tracheal deviation", "hypotension", "decreased consciousness"], "drugs": [], "equipment": ["Chloraprep", "Insert a large-bore cannula (14G orange or 16G grey)", "Remove the needle", "leave the plastic catheter in place", "leave open to air", "Secure in place", "Prepare patient for chest drain"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "needsContent": false}, {"id": "CARD030", "catId": "CAT07", "title": "Burns", "overview": "Burn injuries result from exposure to heat (thermal), chemicals or electricity. Assess capillary refill by pressing with a sterile cotton bud (e.g. bacteriology swab). Classification — Superficial epidermal: capillary refill blanches then rapidly refills. Superficial dermal: skin red/pale pink with blistering, blanches but colour returns slowly. Partial thickness: skin dry, mottled, blotchy and painful (exposed superficial nerves), does not blanch. Full thickness: skin white/brown/black (charred), waxy and painless, does not blanch.", "overviewBlocks": [], "critical": ["% of burns affects fluid replacement rate", "Large surface burns cause mass cell death → severe fluid loss", "Be aware of hyperkalaemia", "Fully undress patient to assess extent of burns"], "signs": ["See classification above"], "drugs": ["Adequate analgesia"], "equipment": ["Underbody Bear Hugger", "fluid warmer", "clingfilm", "Gellonet"], "steps": [{"heading": "THERMAL BURNS", "ordered": true, "items": ["Request anaesthetic assistance for any potential airway damage", "Remove non-adherent clothing and restricting jewellery (do not remove tar/jewellery/clothes adhered to skin)", "Within 20 minutes of injury, irrigate with cool/tepid running water for 20-30 minutes (wet towels/compresses if no water; do not use ice or very cold water — may deepen the wound via vasoconstriction)", "Keep the person warm to avoid hypothermia, especially cooling large areas in children/elderly", "Immediately after cooling, cover with cling film layered on (not wrapped circumferentially) to reduce vasoconstriction risk; use a clean clear plastic bag for hand burns, wrapping fingers/toes individually so they don't adhere (do not use wet dressings or topical creams)", "Elevate the affected area if possible to reduce oedema"]}, {"heading": "CHEMICAL BURNS", "ordered": true, "items": ["Determine the causative chemical where possible", "Remove affected clothing, brush off dry chemical, irrigate copiously with water for an hour (do not attempt to neutralise chemicals — generates additional heat and may increase tissue damage)"]}, {"heading": "", "ordered": false, "items": ["ELECTRICAL BURNS: manage as any other burn but with a lower threshold for admission/review as burns are often deeper than purely thermal; always perform an ECG as these can affect the heart's conducting system"]}], "indications": [], "contraindications": [], "documentation": [], "needsContent": false}, {"id": "CARD031", "catId": "CAT07", "title": "Major Haemorrhage", "overview": "Phone 2222 and advise major haemorrhage, GRI Emergency Department (this does not alert the resus team or any other specialty team). Acute massive haemorrhage is variably defined as 50% blood loss within 3 hours, or a rate >150ml/minute. Normal adult blood volume is 65-70ml/kg — a 70kg male has ~5000ml, so a 50% loss is ~2500ml. Call for help early with uncontrolled bleeding requiring fast replacement. Causes: scalp and external sources (especially small children), chest, abdomen, long bones (especially femurs), pelvis, retroperitoneum.", "overviewBlocks": [], "critical": ["Trauma/obstetrics: early risk of DIC", "Control bleeding", "Hypovolaemic cardiac arrest"], "signs": ["Signs of shock (tachycardia, hypotension)", "reduced GCS", "pale", "sweaty", "bradycardia"], "drugs": ["Emergency O-negative", "TXA"], "equipment": ["Belmont", "fluid warmer", "cardiac monitoring", "NIBP"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "needsContent": false}, {"id": "CARD032", "catId": "CAT07", "title": "EOLC / Tissue Donation", "overview": "End of life care considerations across four domains. PHYSICAL: stop all non-essential medications, blood tests and observations; consider individualised anticipatory prescribing for common end-of-life symptoms; assess for bowel/bladder dysfunction (treatable causes of distress); review hydration needs (encourage oral fluids where possible, accepting higher aspiration risk); regular mouth care. SOCIAL: find out who/what is important to the patient — encourage and support the presence of relatives/carers/friends; establish the patient's preferred place of death and whether it can be arranged/supported. PSYCHOLOGICAL: keep family/carers/friends and the patient (where possible) updated; ask about worries or fears and take time to listen and respond. SPIRITUAL: consider 'agitation' may have spiritual as well as physical causes; offer to contact chaplaincy or the patient's preferred faith leader; enquire about other non-faith sources of comfort or support. Consider the patient's surroundings (pillows, sheets, lighting). Dark towels should be available in the cupboard if a life-ending haemorrhage is expected — blood is less distressing to see on a darker surface than white.", "overviewBlocks": [], "critical": ["Tissue donation age ranges and contraindications — see Diagram/Link column"], "signs": [], "drugs": ["Subcut line: Morphine", "Midazolam", "Hyoscine Butylbromide", "Consider syringe driver"], "equipment": [], "steps": [{"heading": "", "ordered": false, "items": ["EOL Tissue Donation eligibility: 0-70 years — heart valves", "tendons", "skin", "0-95 years — eyes", "Contraindications: dementia", "BBV", "haematological malignancy"]}], "indications": [], "contraindications": ["Dementia", "BBV (blood-borne virus)", "Haematological malignancy"], "documentation": ["Difficult conversations / Palliative Care Team: 0900-1700 Mon-Fri, extension 66307 or 07929766462", "OOH: call via switchboard for advice", "Hospital Chaplain or RC priest via switchboard"], "needsContent": false}, {"id": "CARD033", "catId": "CAT08", "title": "Necrotising Fasciitis", "overview": "An aggressive skin and soft tissue infection causing necrosis of the muscle fascia and subcutaneous tissues, typically travelling along the poorly-vascularised fascial plane. Overlying tissues are initially unaffected, potentially delaying diagnosis and surgery; infection can rapidly spread to fascia, perifascial planes and secondarily to overlying/underlying skin, soft tissue and muscle. Mortality ranges 20-80%. Skin becomes indurated, swollen, shiny and warm, exquisitely tender and often painful out of proportion to presenting symptoms. Skin breakdown begins in 3-5 days with gangrene; pain reduces in the affected area as small vessels thrombose and superficial nerves are destroyed. Advanced stages show systemic symptoms — fever, tachycardia, sepsis. Specialty by area: Trunk = GS; Upper Limb = Plastics; Lower Limb = Ortho; Genitalia = Urology; Neck = ENT. REGARDLESS OF LOCATION, first point of call is the Surgical Registrar to coordinate. Early anaesthetic involvement is key.", "overviewBlocks": [], "critical": ["Mark the affected area (include time)", "Early surgery saves lives", "Life-threatening infection requiring aggressive surgical intervention"], "signs": ["Pain out of proportion", "rapidly spreading cellulitis with skin colour changes from red to bluish-grey", "discolouration", "SIRS", "shock"], "drugs": ["IV antibiotics — Clindamycin (usually given first, suppresses toxin formation)", "Flucloxacillin*", "Benzylpenicillin*", "Metronidazole", "Gentamicin (*if penicillin allergy use Vancomycin)", "Fluid resuscitation"], "equipment": ["ECG", "NIBP", "pre-operative theatre checklist"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "needsContent": false}, {"id": "CARD034", "catId": "CAT08", "title": "GI Blockage", "overview": "Obstruction causes proximal dilatation from build-up of digestive contents and swallowed air. Dilatation increases peristalsis and secretions in an attempt to clear the obstruction; increasing luminal pressure compresses lymphatic vasculature and capillary beds, causing mucosal oedema and third-spacing of fluid into the lumen. If strangulation occurs (or causes the obstruction), arterial supply is compromised and ischaemia/necrosis follow; the bowel wall may lose integrity, allowing gut-flora translocation and systemic infection. Management (absent strangulation) follows 'drip and suck': replace fluid/electrolyte loss and decompress the bowel with a large-bore NG tube. Suspect strangulation with haemodynamic instability, a high/rising lactate, elevated inflammatory markers, or an irreducible hernia. This is a surgical emergency — discuss with ED seniors; likely needs aggressive resuscitation and the on-call surgical registrar.", "overviewBlocks": [], "critical": ["May require theatre from ED", "Careful of faecal aspiration from vomiting"], "signs": ["Colicky/spasmodic abdominal pain (central in SBO, lower in LBO)", "abdominal distension", "constipation/obstipation (inability to pass flatus)", "vomiting (bilious or faecal if obstruction is at/above the ileum)", "bowel sounds hyperactive/'tinkling' early", "reduced or absent later"], "drugs": ["Analgesia"], "equipment": ["Large-bore NG", "catheter-tipped syringe", "straw and water", "drainage bag or spigot"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "needsContent": false}, {"id": "CARD035", "catId": "CAT08", "title": "GI Perforation", "overview": "A hole in any hollow abdominal viscus, allowing spillage of non-sterile GI-tract contents into the sterile abdominal cavity. Contamination initially causes chemical peritonitis; bacterial translocation later causes infective peritonitis, and if untreated, sepsis. Bacterial load increases towards the distal GI tract, and lower bowel perforations are less likely to be contained. Causes: peptic ulcer (perforated duodenal ulcer is the most common cause), appendicitis, diverticulitis, penetrating trauma (adults), blunt trauma e.g. bicycle handlebars (children), iatrogenic e.g. post-endoscopy, IBD, ischaemic colitis. This is a surgical emergency — discuss with ED seniors; likely needs aggressive resuscitation and the on-call surgical registrar.", "overviewBlocks": [], "critical": ["May require theatre from ED", "Careful of faecal aspiration from vomiting"], "signs": ["Peptic ulcer perforation: sudden sharp/stabbing epigastric pain radiating to the back", "Lower GI perforation: usually a preceding causative illness (e.g. appendicitis/diverticulitis) with pain initially localised, then generalising"], "drugs": ["Analgesia", "IV antibiotics", "fluid resuscitation"], "equipment": ["Pre-operative checklist if going to theatre"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "needsContent": false}, {"id": "CARD036", "catId": "CAT09", "title": "Seizure", "overview": "Status Epilepticus (SE) is a life-threatening emergency: tonic-clonic seizures lasting ≥5 minutes, 2+ seizures without return to consciousness, or 3+ tonic-clonic seizures within a 1-hour timeframe. Initial management: maintain airway, resuscitate, administer oxygen; assess cardio-respiratory function; institute regular monitoring (neuro obs + BP, temperature, HR, SaO2, BMs); establish IV access in the largest vein possible. Epilepsy = hyperstimulation of neural pathways. Types: Seizure (manifestation of abnormal, excessive synchronised discharge of cerebral neurons), Aura (symptoms immediately before loss of consciousness), Ictal (during seizure), Post-ictal (period after, when the patient may be confused/disorientated with automatic behaviour). Seizure type table — Partial/Focal (Local, neocortical/hippocampal): consciousness not impaired; twitching/tingling/numbness of a body area, loss of speech, sensory disturbance or 'aura' (strange lights/smells), feeling of fear/doom. Local with ipsilateral propagation, contralateral spread: impaired consciousness; begins as partial, progresses to tonic-clonic, automatic behaviour e.g. chewing/lip-smacking/picking at clothes. Secondarily generalised tonic-clonic: impaired; tonic phase rigidity of all muscles followed by clonic rhythmic jerking, possible tongue biting and urinary/faecal incontinence. Absence: impaired for a few seconds; brief loss of muscle tone, may cause a fall/drop. Epileptic spasm: impaired for a few seconds or not at all; brief jerking of a muscle group, may cause a fall.", "overviewBlocks": [], "critical": ["Status epilepticus", "Be prepared for RSI", "May be agitated during the postictal phase", "Not all seizures are epileptic"], "signs": [], "drugs": ["MOLD: Midazolam (buccal) OR Lorazepam (IV) / Diazepam (rectal)"], "equipment": ["Trauma mask", "suction", "ECG monitoring", "GCS and neuro observations"], "steps": [], "indications": [], "contraindications": [], "documentation": ["Causes: withdrawals", "raised ICP (brain tumours, head injury)", "drug intoxication", "CVA", "hypoglycaemia", "epilepsy", "functional neurological disorder"], "needsContent": false}, {"id": "CARD037", "catId": "CAT09", "title": "CVA (Stroke)", "overview": "A Cerebral Vascular Accident occurs from impaired blood flow to the brain, either from vessel occlusion or haemorrhage due to a ruptured vessel. Neurological impairment depends on the amount and location of oxygen starvation. Use BE FAST: Balance (off-balance/dizziness), Eyes (vision changes), Face (facial droop), Arms (weakness/numbness), Speech (slurred/trouble speaking/confusion), Time (presentation within 4 hours of symptom onset). 9-5 Monday-Friday: call 2222 for thrombolysis to be initiated; out-of-hours discuss with QEUH.", "overviewBlocks": [], "critical": ["CVA can cause reduced GCS", "Assess swallow prior to any oral medications"], "signs": ["LEFT-sided stroke effects: loss of motor function on right side", "language impairment", "right visual field deficit", "intellectual impairment", "RIGHT-sided stroke effects: loss of motor function on left side", "left visual field deficit", "unconcern over loss", "poor judgement/impulsivity"], "drugs": ["Aspirin (PR or oral) in ischaemic CVA only", "Antihypertensives e.g. Metoprolol", "If for thrombolysis — as per protocol"], "equipment": ["STOPPS", "neuro observations", "BM", "ECG", "pressure area care", "continence care", "scales"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "needsContent": false}, {"id": "CARD038", "catId": "CAT09", "title": "Reduced GCS", "overview": "Causes of reduced GCS. Signs of head injury — if present, presume this is the cause and arrange CT brain, but continue investigating other causes (e.g. bloods for metabolic/infective, urine toxin screen). No apparent head injury but lateralising neurology and/or meningism: cerebrovascular event (e.g. brainstem infarct/haemorrhage, large SAH), trauma, space-occupying lesion, intracerebral infection. No apparent head injury and NO lateralising neurology or meningism: toxins/drugs; organ failure (uraemia, hepatic encephalopathy); metabolic (hypoxia/hypercapnia, hyponatraemia, hyper/hypoglycaemia, hyperosmolality, hyper/hypothermia); endocrine (Addisonian crisis, hypothyroidism, hypopituitarism); seizure (non-convulsive status, eclampsia, post-ictal); pseudocoma. GCS scoring — Eyes: 4 Spontaneous, 3 Voice, 2 Pain, 1 None. Voice: 5 Orientated, 4 Confused, 3 Words, 2 Sounds, 1 None. Motor: 6 Obeys commands, 5 Localises to pain, 4 Withdraws to pain, 3 Abnormal flexion, 2 Extension to pain, 1 None.", "overviewBlocks": [], "critical": ["Be aware of compromised airway", "Snoring", "Potential for RSI"], "signs": [], "drugs": ["Naloxone — reverses opioids but not benzodiazepines"], "equipment": ["ECG", "cardiac monitoring", "neuro observations", "BM"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "needsContent": false}, {"id": "CARD039", "catId": "CAT09", "title": "Raised ICP / Head Injury", "overview": "Intracranial pressure (ICP) is normally ≤15mmHg in adults; intracranial hypertension occurs when ICP ≥20mmHg. Increased ICP may be acute or chronic, resulting from traumatic brain injury, large acute ischaemic stroke, intracerebral haemorrhage, aneurysms, brain tumours, or infection (abscess, severe meningitis). Head injury is classified by mechanism (blunt, penetrating, blast), location (diffuse, focal) and severity (mild GCS 13-15, moderate GCS 9-12, severe GCS 3-9). Targets: physical — head up 30°, neutral head position, check tube ties (trouser legs). Blood pressure — assume ICP 20; CPP 60-70 achieved with MAP 80-90mmHg. Ventilation — PaO2 10-13kPa, PaCO2 4.5-5.5kPa. Blood sugar 6-10mmol/L. Serum sodium 140-155mmol/L. Temperature <37.5°C. Seizure prophylaxis.", "overviewBlocks": [], "critical": ["Reduced GCS", "Be prepared for RSI", "Increased agitation", "Fixed and dilated pupils"], "signs": ["Reduced GCS, agitation"], "drugs": ["Sedation bolus: Propofol", "Midazolam", "Hypertonic saline", "Mannitol"], "equipment": ["ECG monitoring", "neuro observations", "NIBP", "BM"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "needsContent": false}, {"id": "CARD040", "catId": "CAT10", "title": "Eclampsia", "overview": "New, otherwise unexplained seizures in a pregnant woman — typically 22/40 up to 2 weeks after delivery. Consider other causes (e.g. check BM). Confirmed if hypertensive AND heavy proteinuria (catheterise and check). Pre-eclampsia signs: severe headache, vision problems (blurring/flashing), pain just below the ribs, vomiting, sudden swelling of the face/hands/feet, hypertension, proteinuria.", "overviewBlocks": [], "critical": ["CALL OBSTETRICS, NEONATES & ANAESTHETICS — the baby will need delivered", "Turn onto left side to avoid aortocaval compression", "High risk for pulmonary oedema — restrict fluids", "Catheterise", "Prepare for RSI"], "signs": ["Headache, seizures"], "drugs": ["Magnesium", "Labetalol", "Oxytocin (brand name Syntocinon, kept in fridge)"], "equipment": ["Eclampsia tray (in resus cupboard 10)", "RSI equipment"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "needsContent": false}, {"id": "CARD041", "catId": "CAT10", "title": "Post Partum Haemorrhage", "overview": "Causes — the 4 T's: Tone (uterine tone, 75-90% of cases), Trauma (vaginal/cervical lacerations, ruptured uterus), Tissue (retained products, incomplete placenta), Thrombin (coagulopathy). Consider applying pressure at the bleeding source. Classification: Primary (blood loss >500ml in first 24hrs post-delivery); Secondary (blood loss >500ml, 24hrs-6 weeks post-delivery). Severity: Minor 500-999ml, Moderate 1000-1999ml, Severe >2000ml.", "overviewBlocks": [], "critical": ["May require 2222 major haemorrhage call"], "signs": [], "drugs": ["Tranexamic acid (TXA)", "O-negative blood"], "equipment": ["Belmont", "towels", "speculum", "overhead lamp", "estimate blood loss"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "needsContent": false}, {"id": "CARD042", "catId": "CAT10", "title": "Active Labour", "overview": "Stage 1: begins with regular contractions, progressively more rhythmic, longer and stronger — typically every 10-15 min, increasing to every 2-3 min; cervix effaces (shortens) and dilates to 10cm. These patients CAN be transferred to the maternity unit. Stage 2: starts at full dilatation and ends with delivery, usually heralded by a strong urge to push — IF VERTEX VISIBLE, PREPARE TO DELIVER IN DEPARTMENT. Stage 3: delivery of placenta, usually within 5-10 minutes but can take up to an hour, generally allowed to happen spontaneously (don't pull on the cord unless actively delivering it). Braxton Hicks contractions: no more than 1-2 per hour, irregular, not increasing in intensity/frequency, resolve with ambulation or activity change. The vast majority are normal spontaneous births — support the baby coming naturally, keep the mother calm with reassurance, push with contractions; Entonox can be used if required. Baby arrival: dry vigorously, delay cord clamping for 2 minutes or until pulsing stops, place hat on baby's head, wrap in a clean warm towel, give to mother.", "overviewBlocks": [], "critical": ["Be alert for cord prolapse and shoulder dystocia — see linked guidance"], "signs": ["Contractions", "'waters breaking'", "urge to push"], "drugs": ["Oxytocin (brand name Syntocinon, kept in fridge)"], "equipment": ["Warm towels", "Baby Roo", "delivery tray", "clean sheets", "inco pads and sanitary pads", "cord clamp and scissors", "hat for baby", "neonatal resus equipment", "apron/gloves"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "needsContent": false}, {"id": "CARD043", "catId": "CAT10", "title": "Perimortem C-Section", "overview": "Split into 3 teams. Maternal ALS: normal ALS principles, intubation, displace uterus to the left side. Hysterotomy team: be prepared with towels, clamp and scissors for the cord. Neonatal resus: Baby Roo on and ready, warm towels and hat, neonatal resus boxes.", "overviewBlocks": [], "critical": ["Purpose is to save the mother — if performed within 4 minutes of arrest there is a higher likelihood the foetus will survive", "CALL FOR HELP: Obstetrics/Neonates, and 2222 obstetric emergency"], "signs": [], "drugs": [], "equipment": ["#10 scalpel", "scissors (blunt end)", "cord clamps", "double glove", "betadine", "wall suction", "face mask", "apron", "C-section tray or thoracotomy tray (aka Majors Tray)", "Baby Roo (turned on)"], "steps": [], "indications": ["Maternal cardiac arrest", "Gestation >24/40 or fundus at/above umbilicus"], "contraindications": [], "documentation": [], "needsContent": false}, {"id": "CARD044", "catId": "CAT11", "title": "Self Poisoning", "overview": "High-risk medications: cardiotoxic drugs (calcium channel blockers, beta-blockers, ACE inhibitors), SSRIs, tricyclic antidepressants, toxic alcohols (methanol, ethylene glycol), antipsychotics, sedatives, anticoagulants, insulin, iron replacement, opioids, recreational drugs. Household solvents, domestic bleaches, weedkillers and pesticides pose airway risk and increase aspiration risk. All medication overdoses should have TOXBASE reviewed by medical staff. 'The dose makes the poison' — even less-toxic agents can cause significant harm in sufficient quantity.", "overviewBlocks": [], "critical": ["Does the medication have a reversal agent/antidote?", "Cardiovascular collapse", "Prolonged QT", "Respiratory compromise", "Reduced GCS", "Seizures", "Serotonin syndrome"], "signs": ["Information required: quantity/dose ingested, time of ingestion, whether prescribed medication or someone else's, well or unwell since, patient's weight, any vomiting since ingestion"], "drugs": ["Antidote cupboard (7, in resus)", "Activated charcoal if presenting within 1 hour of ingestion (cupboard 3, main base) — binds toxic agents in the stomach", "not to induce vomiting"], "equipment": ["ECG", "consider need for cardiac monitoring", "mental health triage", "TOXBASE information printed", "BM"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "needsContent": false}, {"id": "CARD045", "catId": "CAT11", "title": "Serotonin Toxicity", "overview": "Excessive stimulation of serotonin receptors via various mechanisms: direct receptor stimulation (triptans), increased synaptic serotonin release (amphetamines, cocaine, dextromethorphan), increased serotonin precursors (L-tryptophan), decreased serotonin reuptake (SSRIs, TCAs, tramadol). Serotonin receptors are widespread in the CNS/PNS, regulating attention, mood, appetite, autonomic activity and motor tone. Toxic agents (typically >2 combined): SSRIs, MAOIs, TCAs, triptans, tramadol, amphetamines/MDMA, cocaine, L-tryptophan, linezolid, dextromethorphan.", "overviewBlocks": [], "critical": ["Severe toxicity may require RSI", "Requires aggressive cooling — ice covered in towels at pulse points (groin, underarms, neck)", "Do not use Fentanyl/Alfentanil (serotonergic action)", "Hyperkalaemia — do not use Suxamethonium (worsens hyperkalaemia)", "In cardiac arrest, beware melting ice near the defibrillator (water + electricity = bad)"], "signs": ["Confusion/agitation", "coma", "diaphoresis", "hyperreflexia", "rigidity", "diarrhoea and vomiting", "tremor", "myoclonus/clonus", "rhabdomyolysis", "Vital signs: hyperthermia", "tachycardia", "hypertension", "tachypnoea", "hypoglycaemia"], "drugs": ["Cyproheptadine (oral only, serotonin/histamine receptor antagonist)", "Olanzapine", "Diazepam", "Dantrolene", "Lorazepam", "cooled IV fluids (kept in fridge)"], "equipment": ["Ice (not directly on skin — use bags with a light layer of clothing between)", "ECG", "cardiac monitoring", "bladder lavage"], "steps": [{"heading": "", "ordered": false, "items": ["Treatment: ABC and supportive management", "Benzodiazepines for agitation/muscular relaxation", "Cyproheptadine", "IV fluids for rhabdomyolysis", "Ice (not directly on skin)"]}], "indications": [], "contraindications": [], "documentation": [], "needsContent": false}, {"id": "CARD046", "catId": "CAT11", "title": "Methaemoglobinaemia", "overview": "Methaemoglobin is an altered state of haemoglobin where Fe2+ in haem is oxidised to Fe3+, which cannot bind oxygen — reducing the blood's oxygen-carrying capacity. Caused by congenital genetic abnormalities or acquired oxidative stress from drugs/toxins. Symptom severity increases with the degree of methaemoglobinaemia, reflecting reduced tissue oxygen delivery. Suspect it when central cyanosis is present but PaO2 is normal on ABG (PaO2 reflects dissolved O2 in plasma, not O2 bound to Hb) — methaemoglobin is also measured directly by the blood gas machine and will be elevated; SpO2 may be low but rarely low enough to explain central cyanosis alone.", "overviewBlocks": [], "critical": ["Beware seizure"], "signs": ["Headache", "fatigue", "SOB", "lethargy"], "drugs": ["Methylene Blue (found in antidote cupboard 7, resus) — 1-2mg/kg IV for symptomatic patients", "alongside high-flow oxygen", "Methylene blue encourages reduction of iron in methaemoglobin by providing an artificial electron receptor"], "equipment": ["ECG", "cardiac monitoring", "continuous SpO2"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "needsContent": false}, {"id": "CARD047", "catId": "CAT12", "title": "RSI (Rapid Sequence Induction)", "overview": "Indications: airway compromise or protection, oxygenation/ventilation needs, GCS <8 or decreasing, facilitating imaging, transport, anticipated clinical course.", "overviewBlocks": [], "critical": ["Can't Intubate Can't Ventilate (CICV)", "Be prepared for surgical airway (FONA)", "Appropriate number of staff", "Closed loop communication. 'Failure to prepare is preparing to fail.'"], "signs": [], "drugs": ["Opiate: Alfentanil", "Fentanyl", "Induction agent: Propofol", "Ketamine", "Thiopentone", "Paralytic: Rocuronium (kept in fridge; reversed with Sugammadex 16mg/kg)", "Emergency drugs: Atropine", "vasopressor", "Fluids"], "equipment": ["Pillow", "BVM (15L/min)", "suction", "laryngoscope (MAC/McGrath — note blade size)", "ETT", "stylet", "20ml syringe", "filter", "catheter mount", "tube ties/trouser legs", "CO2 monitoring", "PEEP valve", "difficult airway trolley", "bougie", "OPA"], "steps": [{"heading": "", "ordered": false, "items": ["CHECKLIST: 2x IV access, identify cricothyroid, patient position, NG aspirate"]}, {"heading": "", "ordered": false, "items": ["PLAN A: drugs", "tube size", "dose and volume (direct/indirect laryngoscopy)", "PLAN B/C: supraglottic airway, face mask", "PLAN D: FONA — scalpel-bougie-tube"]}], "indications": [], "contraindications": [], "documentation": [], "needsContent": false}, {"id": "CARD048", "catId": "CAT12", "title": "Conscious Sedation", "overview": "Required for multiple ED procedures. Levels of sedation — Minimal (anxiolysis; patient mostly awake and able to answer); Conscious (verbal or light tactile stimulation); Deep (repeated or painful stimulation); Dissociative (Ketamine; patient generally awake with good analgesic effect, amnesic of events post-sedation).", "overviewBlocks": [], "critical": ["Apnoea", "Desaturation", "Cardiovascular collapse", "Vomiting", "Aspiration"], "signs": [], "drugs": ["Propofol", "Ketamine", "Midazolam", "Fentanyl"], "equipment": ["ECG", "SpO2", "ETCO2", "GCS", "NIBP", "O2", "suction"], "steps": [{"heading": "", "ordered": true, "items": ["Prepare the patient and ensure the conscious sedation proforma is completed", "Document pre-procedure observations", "Trauma mask, 15L O2 with CO2 filter attached", "IV access and IV fluids run through and available"]}, {"heading": "POST-PROCEDURE", "ordered": true, "items": ["Ensure patient appropriately monitored during recovery", "Baseline consciousness restored", "Post-procedure observations", "Able to mobilise safely", "Written discharge advice given"]}], "indications": [], "contraindications": [], "documentation": [], "needsContent": false}, {"id": "CARD049", "catId": "CAT12", "title": "Arterial Lines", "overview": "Arterial lines are used to monitor critically ill patients and allow continuous invasive blood pressure monitoring. The radial artery is the most common insertion site, though ulnar, brachial, femoral or dorsalis pedis may also be used.", "overviewBlocks": [], "critical": ["The arterial administration set delivers a continuous slow flush of 3-4ml/hour, keeping the line free from clots", "Zeroing counteracts external pressures (e.g. atmospheric) on the monitoring system, so only true arterial pressure is measured"], "signs": [], "drugs": [], "equipment": ["Transducer/holder", "pressure bag/500ml NS", "Chloraprep", "dressing", "arterial line kit", "dressing pack", "local anaesthetic/needles", "arterial cannula", "sterile gloves", "suture/suture cutter"], "steps": [{"heading": "", "ordered": true, "items": ["Open the transducer set", "Tighten all connections on the set", "Connect NS bag", "Hang pressure bag with NS on IV pole and clamp IV tubing", "Place transducer in holder (electric cable connector downwards)", "Remove all air bubbles from IV tubing", "Unclamp all IV tubing", "Point 3-way tap at the transducer OFF towards the patient", "Pull the blue tab and allow fluid to flow from the NS bag and out of the port with cap at the transducer to clear air bubbles in the first half of IV tubing; then point the 3-way tap at the transducer OFF towards the port with cap", "Pull the blue tab and allow fluid to flow through all the IV tubing", "Place NS in pressure bag and pump to 300mmHg, 3-way tap off to patient line", "Hook up the transducer pressure cable to the red port on the monitor and then to the transducer — a flat pressure wave should appear, with artefact visible when moving the tubing's end", "Level the transducer's 3-way tap to the heart line (intersection of 4th intercostal space and mid-axillary line)", "Attach set-up to patient (waveform should appear on monitor)", "Turn the transducer's 3-way tap OFF to the patient", "Remove the white cap at the transducer, opening tubing to air", "Hit 'Zero' on the monitor, then 'Zero ABP'", "Turn the transducer's 3-way tap off to atmospheric air"]}], "indications": [], "contraindications": [], "documentation": [], "needsContent": false}, {"id": "CARD050", "catId": "CAT12", "title": "Central Lines", "overview": "Sites include internal jugular vein (IJV), subclavian vein (SCV) and femoral vein. Ultrasound-guided technique is often used and requires a non-sterile assistant. The internal jugular vein is the preferred site for CVC insertion by NHS GGC clinicians. Appropriate monitoring is important during insertion in case of complications such as arrhythmia and vasovagal reactions. Used for: giving high-concentration medications to avoid peripheral vasoconstriction (inotropes); when peripheral access is poor; when a high volume of fluid resuscitation is required.", "overviewBlocks": [], "critical": ["Pneumothorax (highest risk with SCV)", "Accidental arterial puncture", "Haemothorax", "Arrhythmia", "Guide wire embolus", "Air embolism"], "signs": [], "drugs": [], "equipment": ["Silver trolley", "central line kit", "quad lumen central line", "dressing", "lidocaine", "foil bowl", "100ml NaCl 0.9%", "Chloraprep x2", "sterile gloves", "sterile gown", "hat"], "steps": [{"heading": "", "ordered": true, "items": ["Surgical scrub before applying maximal sterile barrier precautions", "Sterile barrier precautions: hat, mask, sterile gown, sterile gloves (operator and assistant)", "Sterile drapes covering the whole patient", "Aseptic technique maintained throughout", "Skin prepared with 2% Chlorhexidine gluconate in 70% isopropyl alcohol, allowed to dry completely", "Choose site (IJV, SCV or femoral)", "Ultrasound-guided technique with a non-sterile assistant", "Sterile, transparent semi-permeable dressing covers the catheter site"]}], "indications": [], "contraindications": [], "documentation": [], "needsContent": false}, {"id": "CARD051", "catId": "CAT12", "title": "Chest Drains", "overview": "Chest drains are inserted through an intercostal space into the pleural cavity to remove air, blood, pus or fluid safely, prevent re-introduction of air/fluid, and facilitate lung re-expansion. Since tubes block easily with blood or purulent drainage, a large tube is needed. Attached to a one-way underwater seal drainage system (tube under water ~3cm depth, with a side vent for air escape).", "overviewBlocks": [], "critical": ["Chest drain bottle must stay below the level of the insertion point/chest at all times to prevent fluid re-entering the pleural space", "Bubbling and respiratory swing should be documented on the observation chart", "Avoid kinking or obstructing the tubing"], "signs": [], "drugs": ["Appropriate analgesia"], "equipment": ["Dressing pack", "gown", "sterile gloves", "sterile drapes", "Chloraprep x2", "10ml syringe", "lidocaine", "Seldinger/Rocket chest drain (12Fr/16Fr)", "trauma drain (28Fr or 32Fr)", "suture", "suture cutter", "large Tegaderm", "forceps (curved and straight)", "chest drainage bottle with underwater seal", "sterile water bottle", "appropriate tubing/connector", "cardiac monitoring", "O2/SpO2 monitoring", "NIBP", "chest drain stickers in notes"], "steps": [{"heading": "", "ordered": false, "items": ["Maintaining system safety: keep upright and securely stabilised — avoid knocking the bottle over and caution visitors against handling it; educate the patient where appropriate", "Never clamp a bubbling chest drain (unless advised by senior medical staff) — may cause tension pneumothorax or worsen subcutaneous emphysema", "Fluid should swing with respiration — if absent, check for kinks/blockage and report to medical staff", "Inform medical staff if drainage suddenly increases, or exceeds 100ml/hr of blood — bloody drainage suggests potential clot formation, and bottles may need more frequent changing; little/no drainage may indicate a clot has obstructed the tubing"]}], "indications": ["Haemothorax", "Pneumothorax", "Pleural effusion"], "contraindications": [], "documentation": ["Chest drain chart"], "needsContent": false}, {"id": "CARD052", "catId": "CAT12", "title": "Belmont Rapid Infuser", "overview": "High-speed peristaltic pump enabling accurate, rapid fluid delivery — flow rates from 2.5 to 1,000ml/min. Fully primes in under 1 minute and easily re-primes without disconnecting from the patient.", "overviewBlocks": [], "critical": ["Do not use Hartmann's solution with blood products, and do not use Hartmann's to prime the Belmont if blood products will be used at any point", "Plug in the Belmont before turning on and priming", "Rate of infusion depends on access size and patency"], "signs": [], "drugs": [], "equipment": ["Belmont Rapid Infuser RI-2", "giving set", "500ml bag Normal Saline"], "steps": [{"heading": "", "ordered": true, "items": ["Plug in Belmont Rapid Infuser", "Collect giving set and open packaging", "Tighten all connections on giving set and close clamps", "Open door of infuser using black handle", "Insert reservoir chamber into clamp bracket (requires some force)", "Load circular heat exchanger with red arrow pointing up", "Press the pressure chamber into the pressure chamber well and press the infuse line into the air detector", "Place thicker line to left of the valve wand, thinner line to right", "Push the clear block with blue arrow into the cavity on top of the unit, arrow facing inwards", "Place thicker tube into left groove, thinner tube into right, following markings on infuser; close and latch the door", "Firmly push the button on the right-hand side of the infuser", "Connect a 500ml bag of Normal Saline to any of the three infusion lines", "Ensure the clamp below the reservoir is released", "Follow on-screen instructions until the machine is primed", "Follow on-screen instructions to prime the patient line, ensuring both clamps on the patient line are open", "Once primed and infusion begins, use the up/down infuse-rate option to adjust rate"]}], "indications": ["Need for high volume of blood or fluids quickly", "Need for warmed rapid blood products"], "contraindications": [], "documentation": [], "needsContent": false}, {"id": "CARD053", "catId": "CAT12", "title": "Rapid Tranquillisation", "overview": "The goal is 'to achieve a state of calmness without sedation, sleep or unconsciousness, thereby reducing risk to self and/or others while maintaining the patient's ability to respond to communication' (NICE, 2005), used when appropriate psychological/behavioural de-escalation approaches have failed for acutely disturbed behaviour. It is an option of last resort, aimed at minimising risk to the patient or others. The rapid tranquillisation box is kept in the sedation cupboard (7) in resus. Patients requiring it may need higher levels of observation.", "overviewBlocks": [], "critical": ["Prolonged QT", "Be prepared for apnoea"], "signs": ["Agitation, aggression"], "drugs": ["Olanzapine (oral/IM)", "Lorazepam (oral/IM/IV)", "Promethazine (oral/IM)", "Ketamine (IM/IV)"], "equipment": ["Observations", "ECG", "ACVPU", "If patient refuses observations", "document what you can (colour, airway, breathing, GCS)"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "needsContent": false}, {"id": "CARD054", "catId": "CAT12", "title": "Combat Tourniquet", "overview": "Life-threatening extremity exsanguination needs pressure, and lots of it. The combat tourniquet is a military-designed device that can be applied easily and with adequate force to control arterial haemorrhage, and can be safely applied for up to 2 hours.", "overviewBlocks": [], "critical": ["Limb ischaemia if applied past 2 hours", "Signs of shock"], "signs": [], "drugs": [], "equipment": ["Combat tourniquet (kept in trauma trolley)"], "steps": [{"heading": "", "ordered": true, "items": ["Place around arm with rod on outside, 3 fingerbreadths above the wound", "Feed strap through inner feed of buckle", "Pull to length", "Feed strap through outer feed of buckle", "Pull to length", "Pull strap to tighten around arm — should be tight enough to prevent placing a finger under the strap", "Wrap excess strap around arm, fasten with velcro to tourniquet (excess can be folded on itself)", "Twist the rod to further tighten", "Continue until bleeding stops or the radial pulse is no longer palpable", "When appropriate pressure is applied, place one end of the rod into the clip to lock in place", "Fold strap over clip to further lock into position", "Write the time the tourniquet was sited onto the strap"]}], "indications": [], "contraindications": [], "documentation": [], "needsContent": false}, {"id": "CARD055", "catId": "CAT12", "title": "Pelvic Binder", "overview": "The SAM Splint stabilises an unstable pelvis, with a patented autostop buckle that prevents further pulling once correct compression force is applied. Key tips: lay the splint on the bed before a likely pelvic-injury trauma patient arrives; correct site is at the level of the greater trochanters (often lower than first expected) — ensure nothing is in the patient's pockets before applying; when correct force is applied, an audible click sounds and two prongs release, preventing further force — ensure the prongs remain visible once the strap is secured.", "overviewBlocks": [], "critical": ["Pelvic bones sit near major blood vessels and organs, so pelvic fractures may cause extensive bleeding and other injuries requiring urgent treatment", "Be prepared for signs of internal bleeding", "Adequate analgesia"], "signs": [], "drugs": [], "equipment": ["SAM Splint (kept in trauma trolley)"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "needsContent": false}, {"id": "CARD056", "catId": "CAT12", "title": "Nasal High Flow", "overview": "Nasal high flow (NHF) delivers high-flow humidified air or oxygen via nasal cannula — up to 60L flow and 21-95% O2. Works by clearing upper airway dead space (aids CO2 clearance), giving dynamic positive airway pressure, and humidifying inhaled air to reduce epithelial drying and secretion thickening. OXY-GIN analogy: O2 is the gin, Flow is the tonic — more tonic (flow) dilutes the gin (O2%); O2 + Flow together determine delivered concentration.", "overviewBlocks": [], "critical": ["Tubing is heated to 40°C — do not let the patient lie on tubing (can cause burns)", "Grey band goes to the top of the crown and should not touch the ears", "85% of the UK population fits the M nasal cannula band", "Do NOT use NaCl 0.9% for inhalation — only water", "Do NOT bin the disinfection red tubing or bung"], "signs": [], "drugs": [], "equipment": ["Airvo2", "appropriately sized nasal cannula", "elbow", "chamber", "water for inhalation", "cardiac monitoring", "continuous SpO2 monitoring", "NIBP (frequent BPs)", "tubing for NC", "O2 tubing for flow meter"], "steps": [{"heading": "", "ordered": true, "items": ["Gather equipment", "Fit elbow on top of filter chamber", "Press down silver guard and push filter in until it clicks", "Once secured, spike the water-for-inhalation bag and allow it to flow (no clamp on the tubing, so do not spike before securing the filter)", "Turn on and wait for the tick, allowing humidity and heat to build", "Change options using the play button, going left to right", "Can only change heat and humidity", "Hold up and down arrows together to change and unlock", "Set heat to preference/tolerability", "Minimum flow is 30-35L; aim for around 50L/min", "O2 is added via the flow meter", "Connect nasal cannula to flow tubing", "Choose the appropriate nasal cannula size — grey band to crown of head, occluding nostril size by a maximum of 50% for adequate pressure", "After use, disinfect using the RED tubing and bung — takes 1 hour; do not bin the red tubing or bung"]}, {"heading": "", "ordered": false, "items": ["Air filter requires changing at 1000 hours"]}], "indications": ["Patient who is conscious, spontaneously breathing and requires respiratory support", "All type 1 respiratory failure", "Type 2 respiratory failure if not tolerating NIV or requiring breaks"], "contraindications": ["Undrained pneumothorax", "Basal skull fractures"], "documentation": [], "needsContent": false}, {"id": "CARDMI01", "catId": "CAT13", "title": "Eye Irrigation", "overview": "Flushes particles and harmful chemicals from the conjunctiva and cornea. In chemical injury, irrigation is the immediate priority — begin before examination or visual acuity testing.", "overviewBlocks": [], "critical": ["Chemical ocular burn = medical emergency — irrigate immediately, defer exam/visual acuity until after", "Relative contraindication: if globe rupture suspected, defer irrigation until excluded; do not use a scleral (Morgan) lens if the cornea may be perforated", "Irrigating stream must never be pointed directly at the cornea", "Cornea/conjunctiva can be abraded by the tip of the IV tubing — irrigate carefully"], "signs": [], "drugs": [], "equipment": ["Irrigating solution e.g. NaCl 0.9%, warmed where possi
