<style>
  :root{
    --navy:#12293B; --navy-2:#1B3A52; --teal:#1E6E7A;
    --paper:#F6F7F5; --card-bg:#FFFFFF; --ink:#16232C; --ink-soft:#5B6C76; --line:#E2E6E4;
    --red:#B0342B; --red-bg:#FBECEA;
    --blue:#1F5C8B; --blue-bg:#EAF2FA;
    --green:#2E7D4F; --green-bg:#EAF6EE;
    --orange:#B5691A; --orange-bg:#FCF1E4;
    --purple:#5B4B8A; --purple-bg:#F0EDF7;
    --grey-bg:#EEF0EE;
    --mint:#0F766E; --mint-bg:#E3F3F1;
    --slate:#475569; --slate-bg:#EEF1F4;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;}
  .phone{max-width:460px;margin:0 auto;min-height:100vh;background:var(--paper);display:flex;flex-direction:column;}

  .topbar{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;padding:16px 16px 14px;position:sticky;top:0;z-index:20;}
  .topbar .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9FC3D1;font-weight:600;margin-bottom:2px;}
  .topbar h1{margin:0 0 12px;font-size:20px;font-weight:700;letter-spacing:-0.01em;}
  .search-wrap{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.22);border-radius:10px;display:flex;align-items:center;padding:10px 12px;gap:8px;}
  .search-wrap input{background:transparent;border:none;outline:none;color:#fff;font-size:15px;width:100%;}
  .search-wrap input::placeholder{color:#B9CCD4;}
  .back-row{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);border-radius:20px;padding:7px 14px 7px 12px;cursor:pointer;width:fit-content;margin-bottom:14px;box-shadow:0 2px 6px rgba(0,0,0,0.15);transition:opacity .1s;}
  .back-row:hover{opacity:.88;}
  .back-row:active{opacity:.75;}

  .content{flex:1;padding:16px 16px 90px;}
  .section-label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin:4px 2px 10px;}
  .cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px;}
  .cat-tile{background:var(--card-bg);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;position:relative;overflow:hidden;transition:transform .1s;}
  .cat-tile:active{transform:scale(.97);}
  .cat-tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--bar,var(--teal));}
  .cat-tile .cname{font-size:15px;font-weight:700;color:var(--navy);}
  .cat-tile .ccount{font-size:12px;color:var(--ink-soft);margin-top:4px;}

  .card-row{background:var(--card-bg);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:9px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;gap:10px;}
  .card-row .ctitle{font-size:15px;font-weight:600;color:var(--ink);}
  .card-row .csub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .chev{color:var(--ink-soft);font-size:18px;flex-shrink:0;}
  .badge{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;letter-spacing:.02em;white-space:nowrap;}
  .badge.flag{background:var(--red-bg);color:var(--red);}

  .detail-title{font-size:22px;font-weight:800;color:var(--navy);margin:2px 0 4px;letter-spacing:-0.01em;}
  .detail-cat{font-size:12px;color:var(--teal);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px;}
  .overview{font-size:14.5px;line-height:1.55;color:var(--ink);margin-bottom:16px;}
  .overview p{margin:0;}
  .overview ul{margin:0;padding-left:20px;}
  .overview li{margin-bottom:8px;}
  .overview li:last-child{margin-bottom:0;}
  .box{border-radius:10px;padding:13px 14px 14px;margin-bottom:11px;}
  .box .box-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px;display:flex;align-items:center;gap:6px;}
  .box ul, .box ol{margin:0;padding-left:19px;font-size:13.8px;line-height:1.55;}
  .box li{margin-bottom:4px;}
  .box li:last-child{margin-bottom:0;}
  .box .sub-heading{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin:8px 0 4px;color:inherit;opacity:.85;}
  .box .sub-heading:first-child{margin-top:0;}
  .box.critical{background:var(--red-bg);} .box.critical .box-label{color:var(--red);}
  .box.signs{background:var(--blue-bg);} .box.signs .box-label{color:var(--blue);}
  .box.drugs{background:var(--green-bg);} .box.drugs .box-label{color:var(--green);}
  .box.equipment{background:var(--orange-bg);} .box.equipment .box-label{color:var(--orange);}
  .box.steps{background:#EAF0F5;} .box.steps .box-label{color:var(--navy);}
  .box.indications{background:#E7F4F2;} .box.indications .box-label{color:#146356;}
  .box.contra{background:var(--purple-bg);} .box.contra .box-label{color:var(--purple);}
  .box.docs{background:var(--grey-bg);} .box.docs .box-label{color:var(--ink-soft);}
  .box.ask{background:var(--slate-bg);} .box.ask .box-label{color:var(--slate);}
  .box.discharge{background:var(--mint-bg);} .box.discharge .box-label{color:var(--mint);}
  .box.resources{background:#EFF3F6;} .box.resources .box-label{color:var(--navy);}
  .box.resources a{color:#1F5C8B;text-decoration:underline;text-decoration-style:dotted;}
  .resources-empty{font-size:12.5px;color:var(--ink-soft);font-style:italic;}
  .dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block;}
  .needs-content{background:var(--red-bg);color:var(--red);font-size:12.5px;font-weight:700;padding:10px 12px;border-radius:8px;margin-bottom:14px;}

  .empty{text-align:center;color:var(--ink-soft);font-size:14px;padding:40px 10px;}
  .loading{text-align:center;color:var(--ink-soft);font-size:13px;padding:20px 10px;}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;font-size:13.5px;font-weight:600;z-index:50;box-shadow:0 4px 14px rgba(0,0,0,.2);}

  .footer-link{text-align:center;font-size:12px;color:var(--ink-soft);padding:10px 0 4px;cursor:pointer;text-decoration:underline;}
  .pin-box{background:var(--card-bg);border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:10px;}
  .pin-box h3{margin:0 0 6px;font-size:15px;color:var(--navy);}
  .pin-box p{margin:0 0 14px;font-size:12.5px;color:var(--ink-soft);line-height:1.5;}
  .field{margin-bottom:10px;}
  .field label{font-size:12px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:4px;}
  .field input{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none;}
  .field input:focus{border-color:var(--teal);}
  .btn{width:100%;padding:12px;border-radius:9px;border:none;font-size:14.5px;font-weight:700;cursor:pointer;}
  .btn:disabled{background:#C7CDCF !important;cursor:default;}
  .btn-primary{background:var(--navy);color:#fff;}
  .verify-row{background:var(--card-bg);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;}
  .verify-row .vtitle{font-weight:700;font-size:14.5px;color:var(--navy);}
  .verify-row .vmeta{font-size:12px;color:var(--ink-soft);margin:3px 0 10px;}
  .verify-row .qtext{font-size:13.5px;color:var(--ink);margin:6px 0;}
  .field textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none;font-family:inherit;resize:vertical;}
  .field textarea:focus{border-color:var(--teal);}
  .qa-item{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
  .qa-item .qtext{font-size:13.5px;color:var(--ink);font-weight:600;}
  .qa-item .qa-card-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--teal);margin-bottom:5px;cursor:pointer;}
  .qa-item .qmeta{font-size:11.5px;color:var(--ink-soft);margin-top:3px;display:flex;align-items:center;gap:6px;}
  .qa-item .qanswer{font-size:13px;color:var(--ink);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);}
  .qa-item .qanswer .qalabel{font-weight:700;color:var(--teal);font-size:11px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;}
  .badge.pending{background:var(--grey-bg);color:var(--ink-soft);}
  .badge.answered{background:var(--green-bg);color:var(--green);}
  .expiry-banner{background:#FCEFC7;color:#6B4E00;border-bottom:1px solid #E8CE7A;font-size:12.5px;font-weight:600;line-height:1.4;padding:9px 16px;text-align:center;}

tient and remove free flowing oxygen from the immediate vicinity.", "Charge the defibrillator and once it is safe to do so press the shock button. Keep the shock button pressed until after the shock has occurred – there may be a slight delay before the shock is delivered."]}], "critical": ["Be prepared for sedation", "Shaved chest to apply pads", "Must be 8 cm away from ICD/PPM battery", "Potential for VF."], "signs": [], "drugs": ["Conscious sedation drugs", "Midazolam", "Propofol", "Ketamine", "Fentanyl", "Alfentanil"], "equipment": ["ECG Monitoring", "Defibrillator", "Monitoring set to 2 minute BP cycles if NIBP"], "steps": [], "indications": [], "contraindications": [], "documentation": ["Why", "DCCV is used when", "medical cardioversion is unsuccessful", "The patient is showing signs of shock"], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARD011", "catId": "CAT02", "title": "Ruptured Ectopic Pregnancy", "overview": "An ectopic pregnancy is when a fertilised egg implants itself outside of the womb, usually in one of the fallopian tubes. The fallopian tubes are the tubes connecting the ovaries to the womb. If an egg gets stuck in them, it won't develop into a baby. Ectopic pregnancy rupture is often associated with profound haemorrhage, which may be fatal if rapid surgical intervention isn't undertaken.", "overviewBlocks": [], "critical": ["Ectopic pregnancy is the leading cause of 1st trimester maternal death", "Be prepared for major haemorrhage.", "May be taken straight to theatre."], "signs": ["Diaphragmatic irritation from free blood in the peritoneal space may present as shoulder pain", "Vital sign abnormalities", "Hypotension", "Tachycardia", "Shock", "Lightheadedness/syncope", "Cool, pale skin", "Nausea + vomiting", "Severe abdominal pain"], "drugs": ["TXA", "Analgesia", "O-ve"], "equipment": ["Belmont", "Speculum", "Forceps and sponges/sterile swabs"], "steps": [], "indications": [], "contraindications": [], "documentatio "documentation": [], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARD013", "catId": "CAT03", "title": "DKA", "overview": "Prioritise fluid replacement and 2x PVC access points may be essential. Beware T2DM diabetic medications who have no hyperglycaemia but ketones and acidosis. SGLT2 inhibitors for T2DM – they can give rise to DKA in T2DM.", "overviewBlocks": [{"heading": "Severe uncontrolled diabetes with:", "ordered": false, "items": ["Hyperglycaemia (blood glucose >14 mmol/L, usually but not exclusively)", "Metabolic acidosis (H+ >45mEq/L or HCO3- <18 mmol/L or pH <7.3 on venous gases)", "Ketonaemia (>3 mmol/L) / ketonuria (>++)"]}, {"heading": "", "ordered": false, "items": ["Acidosis can cause a shift of potassium out of cells. This means that initially the serum potassium, K, will go up. Initially in diabetic ketoacidosis will present with elevated potassium. However most potassium is intracellular. Serum K does not reflect the total amount of K in the body.", "The kidneys will dump K because the serum K is high although total body K is steadily going down.", "When the acidosis of diabetic ketoacidosis is corrected the cells are K= depleted and will pull K back in and it is not uncommon to have critically low K+ potentially causing arrhythmias during treatment.", "Severe hyperkalaemia is uncommon but does happen and is likely to be a consequence of acidosis, insulin deficiency, hyperosmolality, severe dehydration and renal potassium retention. Insulin promotes potassium entry into cells. When circulating insulin is lacking, as in DKA, potassium moves out of cells, thus raising plasma potassium levels even in the presence of total body potassium deficiency."]}], "critical": ["Hyperkalaemia in severe DKA", "Prioritise ECG", "Potassium replacement: administer at rate <20 mmol/hour of KCl.", "Repeat VBGs", "Escalate change in GCS"], "signs": ["Reduced GCS", "Pear drop smell", "Vomiting", "Nausea", "Tachypnoea"], "drugs": ["Insulin", "NaCl 0.9%", "Glucose/Potassium/NaCl 0.9%"], "equipment": ["Cardiac Monitoring", "ECG", "Catheter if oliguric (Monitor Urine Output Accurately)", "Fluid Balance", "DKA Pathway 1 + Insulin Prescription sheet"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARD014", "catId": "CAT03", "title": "Bronchospasm", "overview": "Bronchospasm or a bronchial spasm is a sudden constriction of the muscles in the walls of the bronchioles. Can be caused by a number of reasons such as:", "overviewBlocks": [{"heading": "", "ordered": false, "items": ["pulmonary oedema", "asthma", "COPD", "anaphylaxis", "malpositioned endotracheal tube", "medications"]}, {"heading": "", "ordered": false, "items": ["Signs and symptoms include: expiratory wheeze, prolonged expiration, increased inflation pressures, desaturation, hypercapnia, upsloping capnograph trace, silent chest."]}, {"heading": "", "ordered": false, "items": ["Nebs", "O2 driven if Asthma", "Air driven if COPD to maintain spO2 88-92%", "ECG", "Peak flow"]}], "critical": ["Prepare for RSI/NIV", "Absence of wheeze may indicate severe bronchospasm with no air movement."], "signs": ["Expiratory wheeze", "Prolonged expiration", "desaturation", "Hypercapnea", "Silent chest"], "drugs": ["Salbutamol", "Nebuliser, IV Bolus, IV Infusion", "Ipratropium", "Nebuliser", "Adrenaline", "Nebuliser, IM, Slow IV Bolus", "Magnesium 2g over 10 min", "Ketamine", "Aminophylline", "IV Loading Bolus, IV Infusion", "Hydrocortisone", "200 mg IV bolus"], "equipment": ["Cardiac Monitoring", "ECG", "Neb Machine", "Peak Flow", "NIV Machine"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARD015", "catId": "CAT03", "title": "GI Bleed", "overview": "GI bleeding can be divided into upper and lower, referring to which part of the GI tract the bleeding originates from.", "overviewBlocks": [{"heading": "Upper — Causes", "ordered": false, "items": ["Gastritis", "Varices", "Peptic ulcer", "Malignancy"]}, {"heading": "Lower", "ordered": false, "items": ["Haemorrhoids", "IBD", "Diverticular Disease", "Malignancy", "Rectal Varices", "Anal Fissure", "Colitis", "Mesenteric Ischaemia", "Polyp removal site"]}], "critical": ["Emergency O-ve in fridge", "Major haemorrhage 2222"], "signs": ["Upper", "Haematemesis", "Visible fresh red blood", "Coffee ground", "Dark", "Melena", "Black tarry stools caused by upper GI blood", "Lower", "Fresh PR blood passed only with stool", "Fresh PR blood passed without stool, usually lower GI but may be caused by rapid transit upper GI"], "drugs": ["O-Ve", "TXA", "For Variceal Bleeds", "Co-Amoxiclav", "Terlipressin", "Vitamin K", "Reverse anticoagulants"], "equipment": ["Belmont", "Fluid balance", "Cardiac monitoring", "NIBP"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARD016", "catId": "CAT03", "title": "Hypo/Hyperkalaemia", "overview": "Potassium is used throughout the body to facilitate muscle contraction, too much or too little intracellular potassium can have a significant impact on cardiac muscle contraction. It also helps control the balance of fluids in the body. 98% of total potassium stores are located in the cells which generate a concentration gradient critical to cellular excitability and function.", "overviewBlocks": [{"heading": "Hypo", "ordered": false, "items": ["Vomiting, diarrhoea or both also can result in excessive potassium loss from the digestive tract. Causes of potassium loss include:", "Alcohol use (excessive)", "Chronic kidney disease", "Diabetic ketoacidosis", "Diuretics", "Excessive laxative use", "Excessive sweating", "Eating Disorders", "Primary aldosteronism", "Some antibiotic use"]}, {"heading": "Hyper", "ordered": false, "items": ["CKD", "AKI", "Medications (B-Blockers, ACEi)", "Dehydration", "Severe Burns", "Addison's", "Acidosis"]}], "critical": ["ECG changes", "Blood sugar prior to Insulin/Glucose", "Cause of cardiac arrest"], "signs": ["Muscle twitches", "Fatigue", "Peaked T Waves/T wave tenting (hyper)", "ST depression/T wave inversion (hypo)"], "drugs": ["Calcium Chloride", "Calcium Gluconate", "Insulin/Glucose"], "equipment": ["ECG", "Cardiac monitoring", "Blood Glucose Monitoring every 15 mins post insulin/dextrose"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARD017", "catId": "CAT03", "title": "Hyperglycaemic Hyperosmolar State", "overview": "HHS happens when very high blood sugar leads to severe dehydration and highly concentrated blood (high osmolality), which are life-threatening. HHS also involves a lack of insulin, but the person usually still produces enough insulin to prevent the production of ketones. In addition, there's usually an underlying condition, such as an infection, that's also contributing to the high blood sugar.", "overviewBlocks": [{"heading": "", "ordered": false, "items": ["HHS is associated with a significantly higher morbidity and mortality than DKA.", "Fluid losses are estimated to be 10-22L in a person weighing 100kg.", "HHS has slower onset than DKA, usually with no urgent need to clear ketoacidosis, and occurs in patients with brains at higher risk of injury by rapid shifts in sodium and glucose. Therefore, HHS requires less aggressive fluid resuscitation and glucose-lowering strategies than DKA", "Differentiating HHS from DKA is more problematic in the context of severe intercurrent illness due to increased ketosis (e.g. SGLT2i, fasting ketosis) and nonketotic metabolic acidosis (e.g. AKI). If predominant diagnosis is unclear (HHS v DKA v both), then seek early specialist input to help tailor protocol to individual patient needs."]}], "critical": ["GCS changes", "Potassium monitoring"], "signs": ["Extreme thirst", "Confusion"], "drugs": ["NaCl 0.9%", "Potassium replacement if required", "Insulin"], "equipment": ["Cardiac monitoring", "Blood sugar monitoring", "ECG", "Fluid balance"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARD018", "catId": "CAT04", "title": "Bi-PAP/ NIV (Non-Invasive Ventilation)", "overview": "Bi-level positive pressure ventilation (BiPAP). BiPAP is when the ventilator delivers different levels of pressure during inspiration (IPAP) and expiration (EPAP). BiPAP ventilation is effective in reducing mortality and the need for tracheal intubation in patients with an acute decompensation of COPD.", "overviewBlocks": [{"heading": "", "ordered": false, "items": ["Physiological criteria: decompensated type 2 respiratory failure i.e. pH <7.35 (H+ >45mmol/L) and pCO2 >6kPa.", "On maximum medical therapy (and has been for 1 hour), nebulised salbutamol when required, corticosteroids, antibiotics if appropriate, controlled FiO2(usually 28% venturi mask - aim for O2 saturation 86-90%), and reversal of respiratory depressants.", "Moderate to severe dyspnoea, RR >25 bpm."]}], "critical": ["Good fitting mask", "2 person mask placing technique", "Reducing O2", "Rpt ABG at 1hr (Repeat ABGs as per pt's condition after)"], "signs": ["Reduced GCS", "Reduced RR/Increased RR"], "drugs": ["Salbutamol", "Nebuliser: 5mg", "IV bolus: 250mcg diluted, slowly", "IV infusion: 5-20 mcg/min", "Ipratropium", "Nebuliser 0.5mg", "Magnesium", "2g over 10 minutes"], "equipment": ["ECG Monitoring", "NIBP (monitor for hypotension)", "NIV Machine (O2 connected to back)", "Tubing for machine and O2 Tubing", "Appropriate fitting mask"], "steps": [{"heading": "Steps", "ordered": true, "items": ["Size for face mask (select the smallest mask that fits comfortably): small leaks are permitted but not into the eyes.", "Position the patient in bed or chair at >30° angle.", "NIV settings on ST (Self Triggered): IPAP = 10 cm H2O. EPAP = 4 cm H2O. RATE = 12 bpm (becomes active should a patient stop breathing or have periods of apnoea).", "OXYGEN = if supplementary oxygen required, set at 4L/min and titrate as necessary to maintain SpO2 88-92%.", "Increase IPAP in increments of 2 cm H2O to the maximum that patient will tolerate (usually not more than 20 cm H2O)."]}], "indications": [], "contraindications": [], "documentation": ["NIV Chart", "ABGs", "TEP", "Discussion with med reg"], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARD019", "catId": "CAT04", "title": "(COPD) Chronic Obstructive Pulmonary Disease", "overview": "Chronic obstructive pulmonary disease (COPD) is the name for a group of lung conditions that cause breathing difficulties.", "overviewBlocks": [{"heading": "It includes:", "ordered": false, "items": ["emphysema – damage to the air sacs in the lungs", "chronic bronchitis – long-term inflammation of the airways"]}, {"heading": "", "ordered": false, "items": ["COPD is a common condition that mainly affects middle-aged or older adults who smoke.", "Type 1 respiratory failure occurs when the respiratory system cannot adequately provide oxygen to the body, leading to hypoxemia.", "Type 2 respiratory failure occurs when the respiratory system cannot sufficiently remove carbon dioxide from the body, leading to hypercapnia (high CO2)."]}], "critical": ["CO2 Retention", "Reduced GCS"], "signs": ["Wheeze", "Dyspnea", "Chronic Cough", "Productive Cough"], "drugs": ["Nebulisers (air driven)", "Salbutamol", "Ipratropium", "Steroids"], "equipment": ["NIV", "ECG", "Cardiac Monitoring", "Nebulisers"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARD020", "catId": "CAT05", "title": "Thomas Splint", "overview": "", "overviewBlocks": [], "critical": ["Adequate analgesia is important.", "?FIB if not contraindicated", "Catheterisation for females prior to splint", "Be aware of splint causing irritation and pressure damage at groin"], "signs": [], "drugs": [], "equipment": ["Thomas Splint", "TubiGrip", "SoffBan", "Large Gauze", "Tensoplast Skin Traction", "2x tongue depressors wrapped in fabric tape", "Clear medical tape", "Razor", "Scissors", "Measuring tape"], "steps": [{"heading": "", "ordered": true, "items": ["Measure thigh diameter and select appropriately fitting Thomas splint", "Cut appropriate length of tubigrip and place over splint", "Apply skin traction, peel tape and attach to skin of inner and outer thigh", "Use razor if needed", "Secure traction by wrapping with bandage included and tape to secure", "Add layer of soffban", "Place padding behind knee", "Place Thomas splint under leg with tubigrip under leg. Hard brace under leg, soft brace over top."]}, {"heading": "TRACTION STRING", "ordered": true, "items": ["Left end of tie over left side of splint", "Right end of tie under right side of splint", "Wraps around bottom end of splint", "Left side over", "Right side under", "Complete knot at end of splint", "Place tongue depressor between string", "Twist until taught", "Wrap splint in gauze", "Heel should hang over bed"]}], "indications": [], "contraindications": [], "documentation": [], "ask": [], "discharge": [], "resources": [{"label": "St Mungo's ED Guideline", "url": "https://stmungos-ed.com/orthopaedics/thomassplint"}], "needsContent": false}, {"id": "CARD021", "catId": "CAT05", "title": "NOF #", "overview": "A fractured neck of femur (broken hip) is a serious injury, especially in older people. It is likely to be life changing and for some people life threatening. It occurs when the top part of the femur (leg bone) is broken, just below the ball and socket joint. There are two main types of hip fracture, intracapsular and extracapsular.", "overviewBlocks": [{"heading": "Intracapsular Fracture", "ordered": false, "items": ["In this injury the ball on the top of the femur has broken off at its junction with the neck of the upper thigh bone, within the hip joint.", "Occasionally, it is possible to re-attach the ball, but it is usually removed and replaced with half a hip replacement (called a hip hemiarthroplasty) or a total hip replacement, if appropriate."]}, {"heading": "Extracapsular Fracture", "ordered": false, "items": ["This break is further down the femur, outside the hip joint and is fixed using metal work.", "Pressure area care is important for these patients as their mobility is going to be severely impacted."]}], "critical": ["Important to fully examine the patient's limb, potential for mid shaft femur # to be missed if not properly undressed.", "Pressure area care", "Midshaft femur # more likely in patients with an oncology history."], "signs": ["Shortening of the affected limb", "Internal or external rotation"], "drugs": ["Oramorph", "IV fluids", "Consider need for FIB"], "equipment": ["4AT regardless of age", "Big 6", "Heel protection", "ECG", "Cardiac monitoring and regular NIBPs if FIB", "Repose mattress"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARD022", "catId": "CAT05", "title": "Fascia Iliaca Block", "overview": "Fascia Iliaca Blocks (FIBs) are included as part of the big 6 in NOF fracture management in the ED. You should be familiar with the recent RCEM safety alert, which specifies the risk of opiate associated apnoea and the importance of observations in the ED for 30 minutes post procedure. Injection of local anaesthetic into the fascia iliaca compartment allows spread to the femoral and lateral femoral cutaneous nerves that supply the medial, anterior and lateral thigh. FIBs provide not only analgesia during the period in ED, but also ongoing requirements on the ward when the patient is transferred and turned for pressure area care.", "overviewBlocks": [], "critical": ["Opiate related apnoea", "Local Anaesthetic Toxicity"], "signs": [], "drugs": [], "equipment": ["ECG Monitoring", "NIBP (Cycle every 5 Mins)"], "steps": [], "indications": [], "contraindications": ["Agitation", "DOAC", "Warfarin"], "documentation": ["Big 6 proforma", "4AT", "Pressure Areas"], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARD023", "catId": "CAT05", "title": "Limb Reduction", "overview": "Limb reduction is required in order to stabilise an unstable joint/fracture. The limb may be fractured as well but will be dislocated to required reduction. Adequate sedation/analgaesia is required for an effective reduction. Muscles being tense will impede reduction. Good penthrox technique is essential. If penthrox is contra-indicated/ unsuccessful, it will require conscious sedation.", "overviewBlocks": [{"heading": "Depending on the location of the dislocation/# may require:", "ordered": false, "items": ["POP/Back slab", "Broadarm Sling (lancaster sling)", "Knee splint (Buchanan Splint)", "Humeral Brace"]}], "critical": ["Have counter traction prepared for shoulders", "Be prepared for apnoea", "BVM correctly assembled"], "signs": [], "drugs": ["Penthrox", "Conscious Sedation", "NaCl 0.9%"], "equipment": ["CO2 Monitoring", "Fluids", "Trauma Mask", "Sling", "Sedation Drugs", "Sedation proforma", "Pre sedation, mid sedation and post sedation obs", "Plaster Trolley"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARD024", "catId": "CAT06", "title": "Croup/Wheeze", "overview": "Definition and check list to prepare", "overviewBlocks": [], "critical": [], "signs": [], "drugs": [], "equipment": [], "steps": [], "indications": [], "contraindications": [], "documentation": [], "ask": [], "discharge": [], "resources": [], "needsContent": true}, {"id": "CARD025", "catId": "CAT06", "title": "Febrile Convulsions", "overview": "Definition and check list to prepare", "overviewBlocks": [], "critical": [], "signs": [], "drugs": [], "equipment": [], "steps": [], "indications": [], "contraindications": [], "documentation": [], "ask": [], "discharge": [], "resources": [], "needsContent": true}, {"id": "CARD026", "catId": "CAT07", "title": "Anaphylaxis", "overview": "Anaphylaxis is a severe, life-threatening, generalised or systemic hypersensitivity reaction. It is characterised by rapidly developing life-threatening airway (pharyngeal or laryngeal edema) and/or breathing (bronchospasm and tachypnea) and/or circulation (hypotension and tachycardia) problems usually associated with skin and mucosal changes", "overviewBlocks": [{"heading": "", "ordered": false, "items": ["a patient can have anaphylaxis without any urticaria or mucosal signs", "in the patient with known allergies, anaphylaxis may present as isolated hypotension", "early recognition and treatment is important — delay in adrenaline administration is associated with increased mortality and increased rates of biphasic reactions"]}], "critical": ["Prepare for RSI if airway compromised", "Stridor"], "signs": ["Angioedema", "Stridor", "Respiratory distress", "Bronchospasm", "Hypotension and cardiovascular collapse", "Abdominal cramps", "Diarrhoea", "Flushing or pallor", "Urticaria", "Coagulopathy"], "drugs": ["Adrenaline", "IM 0.5mg (1:1,000)", "Nebulised (1:1000) 1 ml diluted with NaCl 0.9% to 5ml", "Fluids"], "equipment": ["ECG", "Cardiac Monitoring", "High flow O2", "NIBP"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARD027", "catId": "CAT07", "title": "Surgical Airway (FONA)", "overview": "Surgical airway is indicated when there is no appropriate alternative means of oxygenating or ventilating a patient. Types are Tracheostomy or Cricothyroidotomy", "overviewBlocks": [{"heading": "Such situations include:", "ordered": false, "items": ["Failed bag mask ventilation, failed extraglottic airway, and failed tracheal intubation;", "Limited access to the upper airway due to entrapment;", "Unable to attempt airway patency manoeuvres via nose or mouth due to massive facial trauma or burns;"]}], "critical": ["Can't Intubate Can't Ventilate (CICV)"], "signs": [], "drugs": ["Antiseptic", "Lidocaine/adrenaline", "Ketamine (if conscious)"], "equipment": ["# 11 Scalpel", "Bougie", "Cuffed 6.0 ETT or Portex 6.0 mini-trach", "Suction"], "steps": [{"heading": "Steps", "ordered": true, "items": ["Scalpel", "Finger", "Bougie", "ETT", "Ventilate"]}], "indications": [], "contraindications": [], "documentation": [], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARD028", "catId": "CAT07", "title": "Thoracotomy", "overview": "Split into two teams, one to resuscitate the patient and one to perform the thoracotomy.", "overviewBlocks": [], "critical": ["Life saving procedure", "Clamshell approach"], "signs": [], "drugs": ["O-ve", "RSI Drugs"], "equipment": [], "steps": [{"heading": "TEAM 1", "ordered": true, "items": ["Grab Thoracotomy Tray from trauma trolley", "Sterile Gloves, Gowns and Masks", "Size 22 Scalpel", "Standard suture pack", "Sterile Tuff Cut scissors", "Position patient with L arm out of the way", "'Baptise' with betadine"]}, {"heading": "TEAM 2", "ordered": true, "items": ["Intubate (26cm go deep into R main bronchus)", "Venous Access (R subclavian or right humeral IO)", "Fluid Resuscitation (2222 major haemorrhage)", "R sided chest drain"]}], "indications": [], "contraindications": [], "documentation": [], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARD029", "catId": "CAT07", "title": "Needle Decompression/Finger Thoracostomy", "overview": "Needle thoracostomy or a finger thoracostomy is an emergent procedure in the management of a tension pneumothorax. While it can arrest progression it is not a definitive treatment. Tension pneumothorax is caused by injured tissues creating a one- way valve into the pleural spaces. Gas accumulates under pressure. If untreated it causes respiratory insufficiency and prevents venous return, to the extent that the patient has a cardiovascular collapse and will die if it is untreated. Needle thoracostomy provides an escape route for the trapped gas, reducing pressure and allowing greater venous return. Finger thoracostomy is essentially the same idea but provides a larger hole for gas or blood escape from.", "overviewBlocks": [], "critical": ["Life saving procedure"], "signs": ["Tension pneumothorax (clinical) signs", "Early:", "Chest pain", "SOB", "Tachypnoea", "Tachycardia", "Reduced breath sounds on affected side", "Hyper- resonance on affected side", "Late:", "Distended neck veins", "Cyanosis/ Hypoxia", "Tracheal deviation", "Hypotension", "Decreased consciousness"], "drugs": [], "equipment": ["Chloraprep", "Insert a large bore (14G; Orange or 16G; Grey)", "Remove the needle, leave plastic catheter in place", "Leave open to air", "Secure in place", "Prepare patient for chest drain"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARD030", "catId": "CAT07", "title": "Burns", "overview": "Burn injuries can result from exposure to heat (including flames, hot liquids or objects; referred to as thermal burns), chemicals and electricity.", "overviewBlocks": [], "critical": ["% of burns will affect fluid replacement rate", "Large surface burns cause mass cell death which can cause severe fluid loss", "Be aware of hyperkalaemia", "Fully undress patient to assess extent of burns"], "signs": [], "drugs": ["Adequate analgesia"], "equipment": ["Underbody Bear Hugger", "Fluid warmer", "Clingfilm", "Gellonet"], "steps": [{"heading": "Management of Thermal Burns", "ordered": true, "items": ["Request anaesthetic assistance for any potential airway damage", "Remove non-adherent clothing and potentially restricting jewellery. (Do not attempt to remove tar, jewellery or clothes that are adhered to the skin).", "Within 20 minutes of the injury, irrigate the burn with cool or tepid running water for 20/30 minutes. If water is not available, use wet towels or compresses. (Note: do not use ice or very cold water, as this may cause vasoconstriction and may deepen the wound).", "Ensure the person is kept warm to avoid hypothermia, especially if cooling large areas of skin in children and the elderly.", "Immediately after cooling, cover the burn using cling film, layered onto the burn rather than wrapped circumferentially, to reduce the risk of vasoconstriction. Consider using a clean, clear plastic bag for burns to the hand and remember to individually wrap the fingers and toes as the burn may make them adhere to adjacent digits. (Note: do not use wet dressings or topical creams).", "Elevate the affected area if possible to reduce the risk of oedema."]}, {"heading": "Management of Chemical Burns (special considerations)", "ordered": true, "items": ["Determine the causative chemical, where possible.", "Remove affected clothing, brush the chemical off the skin if it is in a dry form and copiously irrigate the burn with water for an hour. (Note: do not attempt to neutralise chemicals as additional heat will be generated, which may increase tissue damage)."]}, {"heading": "Management of Electrical Burns (special considerations)", "ordered": false, "items": ["Electrical burns should be managed like any other burn, although the threshold for admission and review should be lower as the burns are often deeper than purely thermal burns. Always perform an ECG as these burns can affect the conducting system of the heart."]}], "indications": [], "contraindications": [], "documentation": ["Classification", "Superficial Epidermal", "Capillary refill blanches then rapidly refills", "Superficial Dermal", "Skin red or pale pink with blistering", "Capillary refill blanches but regains its colour slowly", "Partial Thickness", "Skin dry, mottled, blotchy and painful due to exposed superficial nerves", "Capillary refill does not blanch", "Full Thickness", "Skin is white, brown or black (charred). Waxy and painless", "Capillary refill does not blanch", "Assess capillary refill by pressing with a sterile cotton bud (such as a bacteriology swab)"], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARD031", "catId": "CAT07", "title": "Major Haemorrhage", "overview": "Phone 2222 advise major haemorrhage GRI, Emergency Department. This will not alert the resus team or any other specialty team. Definition of acute massive haemorrhage varies. It can be defined as a 50% blood loss within 3 hours or a rate >150ml/minute. The normal human blood volume in an adult is 65-70 ml/kg; therefore a 70kg male has a blood volume of approximately 5000 ml - a 50% loss is approximately 2500ml. Call for help early with uncontrolled bleeding in which replacement is required fast.", "overviewBlocks": [{"heading": "Causes of Major Haemorrhage", "ordered": false, "items": ["Scalp and external sources (especially small children)", "Chest", "Abdomen", "Long bones (especially femurs)", "Pelvis", "Retroperitoneum"]}], "critical": ["Trauma /obstetrics", "Early risk of DIC", "Control bleeding", "Hypovolaemic cardiac arrest"], "signs": ["Signs of shock", "Tachycardic", "Hypotensive", "Reduced GCS", "Pale", "Sweaty", "Bradycardia"], "drugs": ["Emergency O-ve", "TXA"], "equipment": ["Belmont", "Fluid Warmer", "Cardiac Monitoring", "NIBP"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARD032", "catId": "CAT07", "title": "EOLC/ Tissue Donation", "overview": "", "overviewBlocks": [{"heading": "PHYSICAL", "ordered": false, "items": ["Stop all non-essential medications, blood tests and clinical observations.", "Consider individualised anticipatory prescribing of medications for the common symptoms that patients have nearing the end of life.", "Assess for bowel and bladder dysfunction – these can be treatable causes of distress.", "Review hydration needs – encourage oral fluids where possible, accepting that risk of aspiration may be higher.", "Regular mouth care – try to keep the mouth moist and comfortable."]}, {"heading": "SOCIAL", "ordered": false, "items": ["Find out who and what is important to the patient. The presence of relatives / carers / friends should be encouraged and supported.", "Where is the patient's preferred place of death? If home – can this be arranged and supported?"]}, {"heading": "PSYCHOLOGICAL", "ordered": false, "items": ["Keep family / carers / friends and the patient (whenever possible) updated about the current situation. Ask about worries or fears, taking time to listen and respond."]}, {"heading": "SPIRITUAL", "ordered": false, "items": ["Consider that “agitation” may have spiritual as well as physical causes.", "Offer to contact the chaplaincy service or their preferred faith leader.", "The patient may have other non-faith based sources of comfort or support. Enquire if this may be the case."]}, {"heading": "", "ordered": false, "items": ["Consider the patient's surroundings, such as pillows, sheets and lighting. There should be dark towels in the cupboard if anyone is expected to have a life ending haemorrhage (blood may not look as distressing on a darker surface than white"]}], "critical": ["EOL Tissue Donation", "0-70 years old", "Heart Valves", "Tendons", "Skin", "0-95 years old", "Eyes"], "signs": [], "drugs": ["Subcut Line", "Morphine", "Midazolam", "Hyoscine Butylbromide", "Consider Syringe driver"], "equipment": [], "steps": [], "indications": [], "contraindications": ["Dementia", "BBV", "Haematological malignancy"], "documentation": ["Difficult Conversations", "0900-1700 monday to friday", "Extension 66307", "07929766462", "OOH call via switchboard for advice", "Hospital Chaplain or RC priest via switchboard"], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARD033", "catId": "CAT08", "title": "Necrotising Fasciitis", "overview": "Necrotising fasciitis is a subset of aggressive skin and soft tissue infections (SSTIs) that cause necrosis of the muscle fascia and subcutaneous tissues. The infection typically travels along the fascial plane, which has a poor blood supply. Initially, the overlying tissues are unaffected, potentially delaying diagnosis and surgical intervention. The infectious process can rapidly spread, causing infection of the fascia and perifascial planes as well as secondary infection of the overlying and underlying skin, soft tissue, and muscle. Necrotizing fasciitis is a serious life-threatening infection with mortality rates ranging from 20 to 80%. The texture of the skin will become indurated, swollen, shiny, and feel warm in temperature. At this stage, the skin is exquisitely tender to palpation and can also be painful and out of proportion to presenting symptoms. Skin breakdown will begin in 3 to 5 days and is accompanied by gangrene. Pain is reduced in the affected area secondary to thrombosed small vessels and destruction of the superficial nerves in the subcutaneous tissues. Advanced stages of the infection are characterised by systemic symptoms such as fever, tachycardia, and sepsis.", "overviewBlocks": [{"heading": "Area Specialty", "ordered": false, "items": ["Trunk- GS", "Upper Limb- Plastics", "Lower Limb- Ortho", "Genitalia- Urology", "Neck- ENT"]}, {"heading": "", "ordered": false, "items": ["REGARDLESS OF LOCATION FIRST POINT OF CALL IS SURGICAL REG TO COORDINATE.", "Early anaesthetic involvement is key"]}], "critical": ["Mark the affected area (include time)", "Early surgery saves lives", "Life threatening infection that requires aggressive surgical intervention"], "signs": ["Pain out of proportion", "Rapidly cellulitis with skin colour changes from red to bluish-grey", "Discolouration", "SIRS", "Shock"], "drugs": ["IV abx", "Clindamycin (normally try give first due suppressing toxin formation)", "Flucloxacillin *", "Benzylpenicillin *", "Metronidazole", "Gentamicin", "*if penicillin allergy use vancomycin", "Fluid resuscitation"], "equipment": ["ECG", "NIBP", "Pre-Operative theatre checklist"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARD034", "catId": "CAT08", "title": "GI Blockage", "overview": "", "overviewBlocks": [{"heading": "Pathophysiology", "ordered": false, "items": ["Obstruction causes proximal dilatation due to build-up of digestive contents and swallowed air", "Dilatation causes increased peristalsis & secretions in an attempt to clear the obstruction Increasing luminal pressures causes compression of lymphatic vasculature & capillary beds causing mucosal oedema and third spacing of fluid into the lumen", "If strangulation occurs, or is the cause of obstruction, arterial supply is compromised & ischaemia and necrosis will occur Bowel wall may lose its integrity allowing translocation of gut flora and systemic infection"]}, {"heading": "Management", "ordered": false, "items": ["In the absence of strangulation, initial management follows the concept of 'Drip and Suck'", "Replace fluid and electrolyte loss", "Decompress the bowel by placing a large bore NG tube", "Strangulation should be suspected in the presence of haemodynamic instability, a high or rising lactate, elevated inflammatory markers or irreducible hernia.", "This is a surgical emergency and should be discussed with ED seniors as it is likely to require aggressive resuscitation, and the on-call surgical registrar"]}], "critical": ["May require theatre from ED", "Careful of faecal aspiration from vomiting"], "signs": ["Colicky or spasmodic abdominal pain", "Pain is central in small bowel obstruction (SBO) and lower in large bowel obstruction (LBO)", "Abdominal distension", "Constipation (or Obstipation, inability to pass flatus)", "Vomiting, which may be bilious or faecal if the obstruction is in the ileum or above", "Bowel sounds are hyperactive, often described as 'tinkling', in early obstruction", "Bowel sounds may be reduced or absent later"], "drugs": ["Analgesia"], "equipment": ["Large Bore NG", "Catheter tipped syringe", "Straw and water", "Drainage bag or spigot"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARD035", "catId": "CAT08", "title": "GI Perforation", "overview": "Gastrointestinal perforation is a hole in any hollow abdominal viscera. Communication allows spillage of luminal contents from the non-sterile GI tract and sterile abdominal cavity", "overviewBlocks": [{"heading": "", "ordered": false, "items": ["Contamination initially causes chemical irritation of the peritoneal lining (chemical peritonitis)", "Bacterial translocation will later result in infective peritonitis, if untreated → sepsis Bacterial load increases towards the distal GI tract", "Lower bowel perforations are also less likely to be contained"]}, {"heading": "Causes", "ordered": false, "items": ["Peptic ulcer → perforated duodenal ulcer is the most common cause", "Appendicitis", "Diverticulitis", "Penetrating trauma (adults)", "Blunt trauma e.g. bicycle handlebars (children)", "Iatrogenic e.g. following endoscopy", "Inflammatory Bowel Disease", "Ischaemic colitis"]}, {"heading": "", "ordered": false, "items": ["This is a surgical emergency and should be discussed with ED seniors as it is likely to require aggressive resuscitation, and the on-call surgical registrar"]}], "critical": ["May require theatre from ED", "Careful of faecal aspiration from vomiting"], "signs": ["Peptic ulcer perforation tends to result in sudden onset of sharp/ stabbing epigastric pain radiating to the back", "Lower GI perforation usually has a causative preceding illness e.g. appendicitis/ diverticulitis where pain was localised, then generalises"], "drugs": ["Analgesia", "IV antibiotics", "Fluid Resuscitation"], "equipment": ["Pre-operative checklist if going to theatre"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARD036", "catId": "CAT09", "title": "Seizure", "overview": "Status Epilepticus (SE); a life-threatening medical emergency, defined as tonic-clonic seizures", "overviewBlocks": [{"heading": "", "ordered": false, "items": ["lasting ≥ 5 minutes", "2 or more seizures without return to consciousness", "3 or more tonic-clonic seizures within a 1-hour timeframe"]}, {"heading": "Initial management", "ordered": false, "items": ["Maintain airway, resuscitate and administer oxygen", "Assess cardio-respiratory function", "Institute regular monitoring:", "Neurological observations + BP, T, HR, SaO2, BMs", "Establish IV access in largest vein possible"]}, {"heading": "Epilepsy", "ordered": false, "items": ["Epilepsy is defined as hyper stimulation of neural pathways"]}, {"heading": "Types of epilepsy", "ordered": false, "items": ["Seizure- manifestation of an abnormal and excessive synchronised discharge of a set of cerebral neurons", "Aura- symptoms immediately before loss of consciousness", "Ictal- During seizure", "Post ictal- The period of time immediately after the seizure when the patient may be confused, disorientated, with automatic behaviour."]}, {"heading": "Seizure type table", "ordered": false, "items": ["Partial or Focal onset LOCAL (Neocortical or hippocampal) — Effect on consciousness: Not Impaired. Signs and Symptoms: Twitching or tingling and numbess of a body area, Loss of speech, Sensory disturbance or “aura” eg strange lights and smells, Feeling of fear or doom", "LOCAL Ipsilateral propagation Contralateral spread — Effect on consciousness: Impaired Consciousness. Signs and Symptoms: Begins as a partial seizure but progresses to tonic clonic. Automatic behaviour eg chewing, lip smacking or picking at clothes", "Secondarily Generalised Tonic Clonic — Effect on consciousness: Impaired. Signs and Symptoms: Tonic phase involves rigidity of all muscles followed by clonic phase involving rhythmic jerking of muscles and possible tongue biting and urinary or faecal incontinence", "Absence — Effect on consciousness: Impaired for a few seconds. Signs and Symptoms: Brief loss of muscle tone which may cause patient to fall or drop something", "Epileptic spasm — Effect on consciousness: Impaired for a few seconds or not at all. Signs and Symptoms: Brief jerking of muscle group which may cause a patient to fall"]}], "critical": ["Status epilepticus", "Be prepared for RSI", "May be agitated during the postictal phase.", "Not all seizures are epileptic"], "signs": [], "drugs": ["MOLD", "Midazolam (buccal)", "OR", "Lorazepam (IV)", "Diazepam (rectal)"], "equipment": ["Trauma Mask", "Suction", "ECG monitoring", "GCS and Neuro obs"], "steps": [], "indications": [], "contraindications": [], "documentation": ["Causes", "Withdrawals", "Raised ICP", "Brain tumours", "Head injury", "Drug intoxication", "CVA", "Hypoglycaemia", "Epilepsy", "Functional Neurological Disorder"], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARD037", "catId": "CAT09", "title": "CVA", "overview": "A Cerebral Vascular Accident (CVA) (stroke) occurs as a direct result of impaired blood flow to the brain, either as a result of vessel occlusion or haemorrhage due to ruptured vessel. The nature and extent of neurological impairment that the patient may suffer is dependent on the amount & localisation of oxygen starvation.", "overviewBlocks": [{"heading": "BE FAST", "ordered": false, "items": ["Balance", "Off balance or dizziness", "Eyes", "Vision changes", "Face", "Facial droop", "Arms", "Weakness or numbness", "Speech", "Slurred speech", "Trouble speaking", "confusion", "Time", "Presentation within 4 hours of symptoms"]}, {"heading": "", "ordered": false, "items": ["9-5 Monday to Friday 2222 call for thrombolysis to be initiated, OOH to be discussed with QEUH"]}], "critical": ["CVA can cause reduced GCS", "Assess swallow prior to any oral medications"], "signs": ["Left", "Loss of motor function on R side", "Language impairment", "R visual field deficit", "Intellectual impairment", "Right", "Loss of motor function on L side", "L visual field deficit", "Unconcern over loss", "Poor judgement/ impulsive"], "drugs": ["Aspirin (PR or Oral) in ischaemic CVA only", "Antihypertensives", "Metoprolol", "If for thrombolysis"], "equipment": ["STOPPS", "Neuro Obs", "BM", "ECG", "Pressure area care", "Continence care", "Scales"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARD038", "catId": "CAT09", "title": "Reduced GCS", "overview": "", "overviewBlocks": [{"heading": "Causes of Reduced GCS", "ordered": false, "items": ["Signs of head injury If evidence of head injury presume this is the cause and arrange CT Brain, but continue to investigate other causes e.g. bloods for metabolic or infective, urine toxin screen"]}, {"heading": "No apparent head injury but lateralising neurology and/or meningism:", "ordered": false, "items": ["Cerebrovascular event e.g. brainstem infarct/ haemorrhage, large subarachnoid haemorrhage", "Trauma", "Space occupying lesion", "Intracerebral infection"]}, {"heading": "No apparent head injury and NO lateralising neurology or meningism:", "ordered": false, "items": ["Toxins/ drugs", "Organ failure e.g. uraemia, hepatic encephalopathy Metabolic e.g. hypoxia/ hypercapnia, hyponatraemia, hyper/ hypoglycaemia, hyperosmolality, hyper/ hypothermia,", "Endocrine e.g. Addisonian crisis, Hypothyroidism, Hypopituitarism", "Seizure i.e. non-convulsive status, eclampsia or post- ictal", "Pseudo coma"]}, {"heading": "GCS Scoring", "ordered": false, "items": ["Eyes: 4- Spontaneous, 3-Voice, 2-Pain, 1-None", "Voice: 5- Orientated, 4- Confused, 3- Words, 2-Sounds, 1- None", "Motor: 6- Obeys Commands, 5- Localises to pain, 4- Withdraws to pain, 3- Abnormal flexion, 2-Extension to pain, 1- None"]}], "critical": ["Be aware of compromised airway", "Snoring", "Potential for RSI"], "signs": [], "drugs": ["Naloxone", "Will reverse opioids but not benzodiazepines"], "equipment": ["ECG", "Cardiac Monitoring", "Neuro Obs", "BM"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARD039", "catId": "CAT09", "title": "Raised ICP/Head Injury", "overview": "Intracranial pressure (ICP) is normally ≤15 mmHg in adults. Intracranial hypertension occurs when ICP ≥ 20 mmHg. The development of increased intracranial pressure (ICP) may be acute or chronic. Many diseases or insults can result in increased ICP, including traumatic brain injury, large acute ischemic stroke, intracerebral haemorrhage, aneurysms, brain tumours and infection, such as abscess or severe meningitis.", "overviewBlocks": [{"heading": "Head Injury Classification", "ordered": false, "items": ["HI classified by mechanism, location & severity.", "Blunt, Penetration or Blast", "Diffuse or Focal", "Mild (GCS 13-15), Moderate (GCS 9-12) or Severe (GCS 3-9)"]}, {"heading": "", "ordered": false, "items": ["Physical: Head up 30 and neutral head position", "Check tube ties (trouser legs)", "Blood pressure: Assume ICP 20", "CPP 60-70 will be achieved with a MAP of 80-90mmHg", "Ventilation: PaO2 10-13kPa", "PaCO2 4.5-5.5kPa", "Blood sugar: 6-10 mmol/L", "Serum sodium: 140-155 mmol/L", "Temperature: <37.5C", "Seizure prophylaxis"]}], "critical": ["Reduced GCS", "Be prepared for RSI", "Increased agitation", "Fixed and dilated pupils"], "signs": ["Reduced GCS", "Agitation"], "drugs": ["Sedation bolus:", "Propofol", "midazolam", "Hypertonic Saline", "Mannitol"], "equipment": ["ECG Monitoring", "Neuro obs", "NIBP", "BM"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARD040", "catId": "CAT10", "title": "Eclampsia", "overview": "New, otherwise unexplained seizures in a pregnant lady.", "overviewBlocks": [{"heading": "", "ordered": false, "items": ["Typically 22/40 up to 2 weeks after delivery.", "Consider other causes (e.g. check BM)", "Confirmed if hypertensive AND heavy proteinuria (catheterise and check)"]}, {"heading": "Pre-Eclampsia", "ordered": false, "items": ["severe headache", "vision problems, such as blurring or flashing", "pain just below the ribs", "vomiting", "sudden swelling of the face, hands or feet", "Hypertension", "Proteinuria"]}], "critical": ["CALL OBSTETRICS, NEONATES & ANAESTHETICS (baby will need delivered)", "Turn on to left side to avoid aortocaval compression", "High risk for pulmonary oedema", "Restrict fluids", "Catheterise", "Prepare for RSI"], "signs": ["Headache", "Seizures"], "drugs": ["Magnesium", "Labetalol", "Oxytocin (brand name Syntocinon (kept in fridge))"], "equipment": ["Eclampsia tray (in resus cupboard 10)", "RSI equipment"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARD041", "catId": "CAT10", "title": "Post Partum Haemorrhage", "overview": "", "overviewBlocks": [{"heading": "Causes", "ordered": false, "items": ["Tone", "Uterine tone 75%-90%", "Trauma", "Vaginal/cervical lacerations", "Ruptured uterus", "Tissue", "Retained products", "Incomplete placenta", "Thrombin", "Coagulopathy"]}, {"heading": "", "ordered": false, "items": ["Where the bleeding is from, consider applying pressure."]}, {"heading": "Classification", "ordered": false, "items": ["Primary- blood loss > 500mls in first 24 hrs post delivery", "Secondary- blood loss >500mls 24hrs-6 weeks post delivery", "Types", "Minor- 500-999 mls", "Moderate- 1000mls-1999 mls", "Severe- >2000mls"]}], "critical": ["May require 2222 major haemorrhage"], "signs": [], "drugs": ["Tranexamic Acid (TXA)", "O -ve"], "equipment": ["Belmont", "Towels", "Speculum", "Overhead lamp", "Estimate blood loss"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARD042", "catId": "CAT10", "title": "Active Labour", "overview": "Stage 1: Begins with regular contractions. Progressively more rhythmic, longer and stronger. Typically every 10-15mins increases every 2-3mins. Cervix will efface (shorten) and dilate to 10cm.", "overviewBlocks": [{"heading": "CAN TRANSFER THESE LADIES TO MATERNITY UNIT", "ordered": false, "items": []}, {"heading": "", "ordered": false, "items": ["Stage 2: Starts at full dilatation and ends with delivery of baby Usually heralded by a strong urge to push"]}, {"heading": "IF VERTEX VISIBLE - PREPARE TO DELIVER IN DEPARTMENT", "ordered": false, "items": []}, {"heading": "", "ordered": false, "items": ["Stage 3: Delivery of Placenta: Usually within 5-10 mins but can take up to an hour. Generally allowed to happen spontaneously. Don't pull on cord unless delivering actively"]}, {"heading": "Braxton Hicks Contractions, Remember:", "ordered": false, "items": ["No more than 1 or 2 per hour.", "Irregular and not increasing in intensity or frequency.", "Resolve with Ambulation or Change in Activity"]}, {"heading": "", "ordered": false, "items": ["The vast majority are normal spontaneous births. Usually very little to do actively - support baby coming naturally. Keep mother calm - lots of reassurance. Push with contractions. Can use Entonox if required."]}, {"heading": "Baby Arrival:", "ordered": false, "items": ["Dry vigorously", "Delay clamping of cord for 2 mins or until stops pulsating", "Place hat on baby head", "Wrap in clean warm towel", "Give to mother"]}], "critical": ["Cord Prolapse", "Shoulder dystocia"], "signs": ["Contractions", "'Waters Breaking'", "Urge to push"], "drugs": ["Oxytocin (brand name aka Syntocinon (kept in fridge))"], "equipment": ["Warm Towels", "Baby Roo", "Delivery Tray'", "Clean sheets", "Inco pads & Sanitary Pads", "Cord Clamp & Scissors", "Hat for Baby", "Neonatal Resus Equipment", "Apron/Gloves"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARD043", "catId": "CAT10", "title": "Perimortem C-Section", "overview": "Split into 3 teams", "overviewBlocks": [{"heading": "Maternal ALS", "ordered": false, "items": ["Normal ALS principles", "Intubation", "Displace uterus to L side"]}, {"heading": "Hysterotomy Team", "ordered": false, "items": ["Be prepared with towels and clamp and scissors for cord"]}, {"heading": "Neonatal Resus", "ordered": false, "items": ["Baby Roo on and ready", "Warm Towels and Hat", "Neonatal Resus boxes"]}], "critical": ["Purpose of the procedure is to save the mother", "If done within 4 minutes of arrest, there is a higher likelihood the foetus will survive", "CALL FOR HELP", "Obstetrics/Neonates", "2222 obstetric emergency"], "signs": [], "drugs": [], "equipment": ["#10 scalpel", "Scissors (blunt end)", "Cord Clamps", "Double Glove", "Betadine", "Wall suction", "Fake mask", "Apron", "C-section tray or thoracotomy tray (aka Majors Tray)", "Baby Roo (turned on)"], "steps": [], "indications": ["Maternal Cardiac Arrest", "Gestation >24/40 or fundus at/above umbilicus"], "contraindications": [], "documentation": [], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARD044", "catId": "CAT11", "title": "Self Poisoning", "overview": "", "overviewBlocks": [{"heading": "High Risk Medications:", "ordered": false, "items": ["Cardiotoxic Drugs", "Calcium channel blockers, beta blockers, ACE inhibitors", "SSRIs", "Tricyclic antidepressants", "Toxic alcohols", "Methanol, ethylene glycol", "Antipsychotics", "Sedatives", "Anticoagulants", "Insulin", "Iron replacement", "Opioids", "Recreational drugs"]}, {"heading": "", "ordered": false, "items": ["Ingestion of household solvents, domestic bleaches, weedkillers and pesticides pose risk to the patients airway and increase risk of aspiration.", "All medication overdoses should have toxbase reviewed by medical staff.", "“The dose makes the poison” even the less toxic agents can cause significant harm if taken in sufficient quantities."]}], "critical": ["Does the medication have a reversal agent/ antidote?", "Cardiovascular collapse", "Prolonged QT", "Respiratory compromise", "Reduced GCS", "Seizures", "Serotonin Syndrome"], "signs": ["Information Required", "Quantity/Dose ingested", "Time of ingestion", "Prescribed medication or someone else's", "Well or unwell since", "Patients weight", "Any vomiting since ingestion"], "drugs": ["Antidote cupboard (7 in resus)", "Charcoal if presents within 1 hour of ingestion (cupboard 3 in main base)", "To bind with toxic agents in stomach not to make patients vomit"], "equipment": ["ECG", "Consider need for Cardiac Monitoring", "Mental health triage", "Tox Base Information printed.", "BM"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARD045", "catId": "CAT11", "title": "Serotonin Toxicity", "overview": "", "overviewBlocks": [{"heading": "Pathophysiology: excessive stimulation of serotonin receptors via a variety of mechanisms", "ordered": false, "items": ["Direct stimulation of receptors (triptans).", "Increased synaptic serotonin release (amphetamines, cocaine, dextromethorphan).", "Increased abundance of serotonin precursors (L-tryptophan).", "Decreased serotonin reuptake (SSRIs, TCAs, tramadol)."]}, {"heading": "", "ordered": false, "items": ["Serotonin receptors are widespread in the CNS and PNS and serotonin helps regulate attention, mood, appetite, autonomic activity and motor tone."]}, {"heading": "Toxic agents (typically > 2 agents)", "ordered": false, "items": ["SSRIs", "MAOIs", "TCAs", "Triptans", "Tramadol", "Amphetamines & MDMA", "Cocaine", "L-tryptophan", "Linezolid", "Dextromorphan"]}, {"heading": "Treatment", "ordered": false, "items": ["ABC and supportive management.", "Benzodiazepines for agitation and muscular relaxation.", "Cyproheptadine (serotonin receptor antagonist & histamine receptor antagonist).", "Intravenous fluids for rhabdomyolysis", "Ice (not directly on skin)", "Use bags and light layer of clothing in between"]}], "critical": ["Severe toxicity may require RSI", "Require aggressive cooling", "Ice covered in towels at pulse points (groin, underarms, neck)", "Do not use Fentanyl/Alfentanil due to serotonergic action", "Hyperkalaemia", "Do not use Suxamethonium due to hyperkalaemia", "In cardiac arrest beware melting ice and defibrillator", "Water and electricity = bad"], "signs": ["Confusion/Agitation", "Coma", "Diaphoresis", "Hyperreflexia", "Rigidity", "Diarrhoea & vomiting", "Tremor", "Myoclonus & clonus", "Rhabdomyolysis", "Vital Signs", "Hyperthermia", "Tachycardia", "Hypertension", "Tachypnoea", "Hypoglycaemia"], "drugs": ["Cyproheptadine (oral only)", "Olanzapine", "Diazepam", "Dantrolene", "Lorazepam", "Cooled IV Fluids (kept in fridge)"], "equipment": ["Ice (not directly on skin)", "Use bags and light layer of clothing between", "ECG", "Cardiac Monitoring", "Bladder Lavage"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARD046", "catId": "CAT11", "title": "Methaemoglobinaemia", "overview": "Methaemoglobin is an altered state of haemoglobin in which Fe2+ in haem is oxidised to Fe3+. Fe3+ is unable to bind to oxygen and the oxygen carrying-capacity of the blood is reduced. It is caused by congenital genetic abnormalities or acquired through oxidative stress from drugs or toxins. Symptoms become more severe with the degree of methaemoglobinaemia and result from reduced oxygen delivery to the tissues. Suspect methaemoglobinaemia when central cyanosis is present but normal PaO2 is seen on arterial blood gas (PaO2 represents dissolved O2 in the plasma rather than O2 bound to haemoglobin). Methaemoglobin is also measured by the blood gas machine and will be elevated. SpO2 may be low but rarely to the level required to cause central cyanosis. Treat symptomatic patients with high-flow oxygen and methylene blue 1-2 mg/kg IV. Methylene blue encourages reduction of iron in methaemoglobin by providing an artificial electron receptor.", "overviewBlocks": [], "critical": ["Beware Seizure"], "signs": ["Headache", "Fatigue", "SOB", "Lethargy"], "drugs": ["Methylene Blue (found in antidote cupboard 7 in resus)"], "equipment": ["ECG", "Cardiac Monitoring", "Continuous spO2"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARD047", "catId": "CAT12", "title": "RSI", "overview": "Rapid Sequence Induction", "overviewBlocks": [{"heading": "Indications", "ordered": false, "items": ["Airway Compromise or Protection", "Oxygenation/Ventilation", "GCS <8/Decreased", "Facilitate Imaging", "Transport", "Anticipated Clinical Course"]}, {"heading": "Checklist", "ordered": false, "items": ["PVC x 2", "Identify cricothyroid", "Patient position", "NG Aspirate"]}, {"heading": "Plan A", "ordered": false, "items": ["Drugs, tube size, dose & volume (direct/indirect)"]}, {"heading": "Plan B/C", "ordered": false, "items": ["Supraglottic airway", "Face Mask"]}, {"heading": "Plan D", "ordered": false, "items": ["FONA", "Scalpel-bougie-tube"]}], "critical": ["Can't Intubate Can't Ventilate (CICV)", "Be prepared for surgical airway (Front of Neck Access)", "Appropriate no. of staff", "Closed loop communication", "Failure to prepare is preparing to fail."], "signs": [], "drugs": ["Opiate", "Alfentanil", "Fentanyl", "Induction Agent", "Propofol, Ketamine, Thiopetone", "Paralytic", "Rocuronium (kept in fridge)", "Reversed with SUGAMMADEX (16 mg/kg)", "Emergency Drugs", "Atropine", "Vasopressor", "Fluids"], "equipment": ["Pillow", "BVM (15 L/Min)", "Suction", "Laryngoscope (MAC/McGrath), blade size", "Endotracheal Tube (ETT)", "Stylet", "20ml Syringe", "Filter", "Catheter mount", "Tube Ties/Trouser legs", "CO2", "PEEP Valve", "Difficult Airway Trolley", "Bougie", "OPA"], "steps": [], "indications": [], "contraindications": [], "documentation": [], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARD048", "catId": "CAT12", "title": "Conscious Sedation", "overview": "Conscious sedation is required for multiple procedures within the emergency department.", "overviewBlocks": [{"heading": "Level of Sedation", "ordered": false, "items": ["Minimal", "Anxiolysis. Patient mostly awake and able to answer.", "Conscious", "Verbal or light tactile stimulation.", "Deep", "Repeated or painful stimulation.", "Dissociative", "Ketamine.", "Patients generally awake but have a good analgesic effect and amnesic of events post sedation."]}], "critical": ["Apnea", "Desaturation", "Cardiovascular collapse", "Vomiting", "Aspiration"], "signs": [], "drugs": ["Propofol", "Ketamine", "Midazolam", "Fentanyl"], "equipment": ["ECG", "spO2", "ETCO2", "GCS", "NIBP", "O2", "Suction"], "steps": [{"heading": "Steps", "ordered": true, "items": ["Prepare the patient and ensure the conscious sedation performa completed", "Pre-procedure observations documented", "Trauma mask, 15L O2 with CO2 filter attached", "PVC and IV fluids run through and available"]}, {"heading": "Post Procedure", "ordered": true, "items": ["Ensure patient is appropriately monitored during recovery", "Baseline consciousness restored", "Post procedure observations", "Able to mobilise safely", "Written discharge advice given"]}], "indications": [], "contraindications": [], "documentation": [], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARD049", "catId": "CAT12", "title": "Arterial Lines", "overview": "", "overviewBlocks": [], "critical": ["The arterial administration set delivers a continuous slow flush of 3-4 ml per hour; this keeps the line free from clots.", "Zeroing is performed to counteract the influence of external pressures, such as atmospheric pressure, on the monitoring system. Zeroing the transducer ensures that only the arterial pressure will be measured so the arterial blood-pressure readings will be accurate."], "signs": [], "drugs": [], "equipment": ["Transducer/Holder", "Pressure Bag/ 500ml NS", "Chloraprep", "Dressing", "Arterial Line Kit", "Dressing pack", "Local/needles.", "Arterial cannula.", "Sterile Gloves", "Suture/Suture cutter"], "steps": [{"heading": "", "ordered": true, "items": ["Open the transducer set", "Tighten all the connections on the set", "Connect NS bag", "Hang pressure bag with NS on IV pole and clamp IV tubing", "Place transducer in transducer holder (so electric cable connector is downwards)", "Removing all air bubbles from IV tubing", "Unclamp all the IV tubing", "Point 3 way tap at the transducer OFF towards the patient", "Pull on blue tab and allow fluid to flow from NS bag and out of port with CAP on it at transducer to clear all air bubbles in first half of IV tubing Now point 3 way tap at the transducer off towards port with CAP on it", "Pull on blue tab and allow fluid to flow from NS bag and out through all the IV tubing", "Place NS in pressure bag and pump to 300 mg Hg and 3 way tap off to patient line", "Hook up the Transducer Pressure Cable to the red port on the side of the monitor and then to transducer, a flat pressure wave should appear, you should see artefact when you move the end of your tubing", "Level 3 way tap on the transducer to the heart line (intersection of 4th intercostal space and midaxillary line)", "Attach set-up to patient (you should see a waveform on the monitor)", "Turn the 3 way tap at the transducer OFF to the patient.", "Take the WHITE cap at the transducer off, now tubing is open to air.", "Hit “Zero” on monitor, then hit “Zero ABP”", "Turn 3 way tap at transducer (off to atmospheric air)"]}], "indications": [], "contraindications": [], "documentation": ["Why we use arterial lines.", "Arterial lines are used to monitor critically ill patients and allow for continuous invasive blood pressure monitoring. The radial artery is the most common site for arterial line insertion but other arteries such as ulnar, brachial, femoral or dorsal pedis may be used."], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARD050", "catId": "CAT12", "title": "Central Lines", "overview": "", "overviewBlocks": [], "critical": ["pneumothorax (highest for SCV)", "accidental arterial puncture", "haemothorax", "arrhythmia", "guide wire embolus", "air embolism"], "signs": [], "drugs": [], "equipment": ["Silver Trolley", "Central Line Kit", "Quad Lumen Central Line", "Dressing", "Lidocaine", "Foil Bowl", "100ml NaCl 0.9%", "Chloraprep x2", "Sterile Gloves", "Sterile Gown", "Hat"], "steps": [{"heading": "Steps", "ordered": true, "items": ["Surgical scrub is performed before application of maximal sterile barrier precautions.", "Sterile barrier precautions are used; hat, mask, sterile gown and sterile gloves (Operator and Assistant).", "Sterile drapes used to cover the whole patient.", "Aseptic technique maintained throughout the insertion procedure.", "Skin prepared by decontamination of the insertion site using 2% Chlorhexidine gluconate in 70% isopropyl alcohol and allowed to dry completely.", "Sites include internal jugular vein (IVC), Subclavian Vein (SVC) and Femoral vein.", "Ultrasound guided technique is often used and requires a non sterile assistant.", "A sterile, transparent semi-permeable dressing is used to cover the catheter site."]}, {"heading": "", "ordered": false, "items": ["* The internal jugular vein is the preferred site for CVC insertion by NHSGGC clinicians. It is important to have appropriate monitoring on the patient when inserting a CVC incase of complications such as arrhythmia and vasovagal reactions."]}], "indications": [], "contraindications": [], "documentation": ["Why We Use Central Lines", "For giving high concentration medications to avoid peripheral vasoconstriction (inotropes)", "When peripheral access is poor", "When high volume of fluid resuscitation is required."], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARD051", "catId": "CAT12", "title": "Chest Drains", "overview": "Chest drains are inserted through an intercostal space into the pleural cavity and are designed to:", "overviewBlocks": [{"heading": "", "ordered": false, "items": ["Remove air, blood, pus or fluid safely", "Prevent re-introduction of air or fluid", "Facilitate lung reexpansion"]}, {"heading": "Chest Tube Selection", "ordered": false, "items": ["Since these tubes can become plugged easily with blood or purulent drainage, a large tube is needed."]}, {"heading": "Maintaining safety of the underwater seal drainage system:", "ordered": false, "items": ["Once the chest tube is inserted, it is then attached to a drainage system which only allows one direction of flow. This is usually the closed underwater seal bottle in which a tube is placed under water at a depth of approximately 3 cm with a side vent which allows escape of air.", "It must be kept upright. Care should be taken to avoid knocking the chest drain bottle over – ensure that it is securely stabilised. Caution visitors against handling equipment or displacing the drainage bottle. Where appropriate, educate the patient.", "Chest drains must not be clamped unless advised by snr medical staff. Never clamp a bubbling chest drain as this may result in a tension pneumothorax or possibly worsening subcutaneous emphysema.", "Fluid within the tube should swing with respiration. If the swing is absent, check for kinks or blockage. Report same to medical staff.", "Inform medical staff if drainage suddenly increases or there is more than 100ml/hr of blood drainage. Bloody drainage in the chamber indicates a potential for clot formation in the tubing and collection bottles may need to be changed more regularly. Little or no drainage may indicate that clots have obstructed the connecting tubing."]}], "critical": ["Chest drain bottle must stay underneath the point of insertion/level of the chest at all times to prevent fluid re-entering into the pleural space.", "Bubbling and the presence of respiratory swing should be documented on the patient's observation chart.", "Avoid kinking or obstructing the chest drain tubing"], "signs": [], "drugs": ["Appropriate analgesia"], "equipment": ["Dressing pack", "Gown", "Sterile Gloves", "Sterile Drapes", "Chloraprep x2", "Syringe 10ml", "Lidocaine", "Seldinger/Rocket Chest Drain (12Fr/16Fr)", "Trauma (28Fr or 32Fr)", "Suture", "Suture Cutter", "Large Tegaderm", "Forceps (curved and straight)", "Chest drainage bottle with underwater seal", "Sterile water bottle", "Appropriate tubing/connector.", "Cardiac Monitoring", "O2/spO2 monitoring", "NIBP", "Chest Drain stickers in notes", "Chest Drain Chart"], "steps": [], "indications": ["Haemothorax", "Pneumothorax", "Pleural Effusion"], "contraindications": [], "documentation": [], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARD052", "catId": "CAT12", "title": "Belmont Rapid Infuser", "overview": "", "overviewBlocks": [], "critical": ["Do not use Hartman's solution with blood products. Do not use Hartmans to prime the Belmont if at any point using blood products.", "Plug in the Belmont prior to turning on and attempting to prime", "Rate of infusion will depend on access size and patency"], "signs": [], "drugs": [], "equipment": [], "steps": [{"heading": "Step by Step Guide", "ordered": false, "items": ["Step 1: Plug in Belmont Rapid Infuser", "Step 2: Collect Giving set and open packaging", "Step 3: Tighten all connections on giving set and close clamps.", "Step 4: Open door of infuser using black handle.", "Step 5: Insert reservoir chamber into clamp bracket, this requires some force", "Step 6: Load circular heat exchanger with red arrow pointing up", "Step 7: Press the pressure chamber into pressure chamber well and press the infuse line into the air detector", "Step 8: Place thicker line to left of the valve wand and the thinner line to right of the valve wand", "Step 9: Push the clear block with blue arrow into cavity on top of unit, with blue arrow facing inwards", "Step 10: Place thicker tube into left groove and thinner tube to the right following markings on infuser close and latch the door", "Step 11: Firmly push on button on right hand side of infuser", "Step 12: Connect 500ml bag of Normal Saline to any of the three infusion lines", "Step 13: Ensure clamp below reservoir released", "Step 14: Follow instructions on screen until machine primed", "Step 15: Follow onscreen instructions to prime the patient line, ensure both clamps on the patient line are opened.", "Step 16: Once primed infusion begins, use the up and down infuse rate option to increase and decrease rate."]}], "indications": ["Need for high volume of blood or fluids quickly.", "Need for warmed rapid blood products"], "contraindications": [], "documentation": ["Benefits", "High-speed peristaltic pump enables accuracy in fluid delivery, with flow rates ranging from 2.5 to 1,000 ml/min.", "The Belmont Rapid Infuser RI-2 fully primes in under 1 minute and easily re-primes without disconnecting from the patient"], "ask": [], "discharge": [], "resources": [], "needsContent": false}, {"id": "CARD053", "catId": "CAT12", "title": "Rapid Tranquillisation", "overview": "The goal of rapid tranquil
